[workspace]
resolver = "2"
members = [
    "nidgen",
    "coverage-report",
    "abi-verify",
    "spu-elf-to-ppu-obj",
    "prx-gen",
    "sfo",
    "make-sdata",
    "ovis",
]
# ps3dk-version (the version string every tool prints) is a library and is
# not listed here: it joins the workspace as a path dependency, and the list
# above names only crates that ship binaries (scripts/list-rust-bins.sh).

[workspace.package]
# Fixed on purpose: Cargo hashes the crate version into every symbol, so a
# per-release bump changed the code layout of every tool.  The version the
# tools print is tools/VERSION (see ps3dk-version and scripts/sync-versions.sh).
version = "0.0.0"
edition = "2021"
authors = ["PS3 Custom Toolchain contributors"]
license = "MIT"
repository = "https://github.com/FirebirdTA01/PS3_Custom_Toolchain"
# The highest rust-version among the locked dependencies (icu_* and image).
# Kept true so an older cargo stops with "requires rustc 1.88" instead of a
# manifest parse error deep in the dependency graph.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
ar = "0.9"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ps3dk-version = { path = "ps3dk-version" }
object = { version = "0.36", default-features = false, features = ["read", "write", "elf", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
thiserror = "1.0"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
# Strip the local debug sections before the final .exe ships; the RUSTFLAGS
# --remap-path-prefix handles the *paths* that remain.  panic stays at its
# default (abort would change runtime behaviour and is not needed here).
strip = true
