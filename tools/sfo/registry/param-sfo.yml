  - { code: "XR", label: "disc subfolder: PS3_EXTRA/", source: "psdevwiki", confidence: observed }

schemas:
  - id: game
    label: Game PARAM.SFO
    keys:
      - name: TITLE
        format: utf8
        max_len: 128
        confidence: confirmed
        source: ps3dk-gamecontent
        behavior: "Localized title fallback target when TITLE_NN for the configured language is empty."
      - name: TITLE_00..TITLE_19
        format: utf8
        max_len: 128
        confidence: confirmed
        source: ps3dk-gamecontent
        behavior: "RPCS3 picks TITLE_%02d by CellSysutilLang value and falls back to TITLE when empty."
        notes: "Localized titles; TITLE_NN = cellGame PARAMID - 2."
      - name: TITLE_ID
        format: utf8
        max_len: 16
        confidence: confirmed
        source: sfo-c
        validation: "ABCD12345 PSDevWiki convention. No PARAM.SFO regex in RPCS3; the 9-character rule is directory handling. Empty TITLE_ID is skipped."
        validation_confidence: observed
        behavior: "Identity key for HDD game, disc update and game data lookup."
        notes: "sfo.c pads to 16 bytes; cellGame API size is 10 bytes including NUL."
      - name: VERSION
        format: utf8
        max_len: 6
        default: "01.00"
        confidence: confirmed
        source: ps3dk-gamecontent
        validation: "NN.NN convention"
        validation_confidence: observed
        behavior: "Disc/master revision and legacy fallback when APP_VER is absent; guest-writable by cellGameCreateGameData."
      - name: APP_VER
        format: utf8
        max_len: 6
        default: "01.00"
        confidence: confirmed
        source: ps3dk-gamecontent
        validation: "NN.NN convention"
        validation_confidence: observed
        behavior: "Game or patch version; used by install lock and package update checks."
      - name: PS3_SYSTEM_VER
        format: utf8
        max_len: 8
        default: "01.8000"
        confidence: confirmed
        source: ps3dk-gamecontent
        validation: "DD.DDDD"
        behavior: "RPCS3 compares it to installed firmware and boot aborts if higher; malformed values silently disable the check."
      - name: PARENTAL_LEVEL
        format: integer
        max_len: 4
        default: "0"
        confidence: confirmed
        source: ps3dk-gamecontent
        validation: "range 1..11"
        validation_confidence: confirmed
        behavior: "Surfaced to guests; RPCS3 does not enforce parental controls."
        notes: "RPCS3 UI notes only 1,2,3,5,7,9 are normally used."
        values:
          - { value: "0", label: "unset", source: rpcs3-runtime, confidence: observed }
          - { value: "1", label: "0+", source: rpcs3-runtime, confidence: observed }
          - { value: "2", label: "3+", source: rpcs3-runtime, confidence: observed }
          - { value: "3", label: "7+", source: rpcs3-runtime, confidence: observed }
          - { value: "4", label: "10+", source: rpcs3-runtime, confidence: observed }
          - { value: "5", label: "12+", source: rpcs3-runtime, confidence: observed }
          - { value: "6", label: "15+", source: rpcs3-runtime, confidence: observed }
          - { value: "7", label: "16+", source: rpcs3-runtime, confidence: observed }
          - { value: "8", label: "17+", source: rpcs3-runtime, confidence: observed }
          - { value: "9", label: "18+", source: rpcs3-runtime, confidence: observed }
          - { value: "10", label: "Level 10", source: rpcs3-runtime, confidence: observed }
          - { value: "11", label: "Level 11", source: rpcs3-runtime, confidence: observed }
      - name: RESOLUTION
        format: integer
        max_len: 4
        default: "63"
        confidence: confirmed
        source: rpcs3-psf
        behavior: "If configured video mode is absent from the mask, RPCS3 logs an error and forces 720p."
        flags:
          - { mask: 1, name: ntsc, label: "480", source: rpcs3-psf, confidence: confirmed }
          - { mask: 2, name: pal, label: "576", source: rpcs3-psf, confidence: confirmed }
          - { mask: 4, name: hd_720, label: "720", source: rpcs3-psf, confidence: confirmed }
          - { mask: 8, name: hd_1080, label: "1080", source: rpcs3-psf, confidence: confirmed }
          - { mask: 16, name: ntsc_16_9, label: "480 16:9", source: rpcs3-psf, confidence: confirmed }
          - { mask: 32, name: pal_16_9, label: "576 16:9", source: rpcs3-psf, confidence: confirmed }
      - name: SOUND_FORMAT
        format: integer
        max_len: 4
        default: "279"
        confidence: confirmed
        source: rpcs3-psf
        behavior: "Builds the cellAudioOut supported-mode list; absent value defaults to LPCM 2ch."
        notes: "Examples: 21, 258, 279, 514, 791. Dolby Digital and DTS examples include flag 0x2."
        flags:
          - { mask: 1, name: lpcm_2, label: "LPCM 2ch", source: rpcs3-psf, confidence: confirmed }
          - { mask: 2, name: dolby_dts_required_0x2, label: "Unnamed flag required by Dolby Digital/DTS examples", source: psdevwiki, confidence: speculative }
          - { mask: 4, name: lpcm_5_1, label: "LPCM 5.1", source: rpcs3-psf, confidence: confirmed }
          - { mask: 16, name: lpcm_7_1, label: "LPCM 7.1", source: rpcs3-psf, confidence: confirmed }
          - { mask: 256, name: dolby_digital_5_1, label: "Dolby Digital 5.1", source: rpcs3-psf, confidence: confirmed }
          - { mask: 512, name: dts_5_1, label: "DTS 5.1", source: rpcs3-psf, confidence: confirmed }
      - name: ATTRIBUTE
        format: integer
        max_len: 4
        default: "0"
        confidence: confirmed
        source: psdevwiki
        behavior: "Copied verbatim to guests; RPCS3 has no game behavior except observed UI metadata."
        notes: "Bootable-content interpretation from PSDevWiki text lines 1003-1192 and 1307-1392. Do not confuse this with CELL_GAME_ATTRIBUTE_* launch flags. Context-specific patch and disc-subfolder tables are listed separately."
        flags:
          - { mask: 1, name: psp_remote_play_v1, label: "PSP Remote Play v1, firmware 1.10", source: psdevwiki, confidence: confirmed }
          - { mask: 2, name: psp_export, label: "PSP Export / Copy to PSP", source: psdevwiki, confidence: confirmed }
          - { mask: 4, name: psp_remote_play_v2, label: "PSP Remote Play v2, firmware 1.80; requires v1", source: psdevwiki, confidence: confirmed }
          - { mask: 8, name: xmb_ingame_forced_enable, label: "XMB In-Game forced enabled", source: psdevwiki, confidence: confirmed }
          - { mask: 16, name: xmb_ingame_disabled, label: "XMB In-Game disabled", source: psdevwiki, confidence: confirmed }
          - { mask: 32, name: xmb_ingame_bgm, label: "XMB In-Game background music", source: psdevwiki, confidence: confirmed }
          - { mask: 64, name: system_voice_chat, label: "System voice chat", source: psdevwiki, confidence: speculative }
          - { mask: 128, name: psvita_remote_play, label: "PS Vita Remote Play, firmware 4.00", source: psdevwiki, confidence: confirmed }
          - { mask: 256, name: move_controller_warning, label: "Move Controller warning screen", source: psdevwiki, confidence: confirmed }
          - { mask: 512, name: navigation_controller_warning, label: "Navigation Controller warning screen; requires Move warning", source: psdevwiki, confidence: confirmed }
          - { mask: 1024, name: ps_eye_warning, label: "PlayStation Eye Camera warning screen; requires Move warning", source: psdevwiki, confidence: confirmed }
          - { mask: 2048, name: move_calibration_notification, label: "Move calibration notification", source: psdevwiki, confidence: confirmed }
          - { mask: 4096, name: stereoscopic_3d_warning, label: "Stereoscopic 3D warning", source: psdevwiki, confidence: confirmed }
          - { mask: 8192, name: psnow_beta_notification, label: "PlayStation Now Beta notification screen", source: psdevwiki, confidence: speculative }
          - { mask: 16384, name: reserved_0x4000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 32768, name: reserved_0x8000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 65536, name: install_disc, label: "Install Disc", source: psdevwiki, confidence: confirmed }
          - { mask: 131072, name: install_packages, label: "Install Packages", source: psdevwiki, confidence: confirmed }
          - { mask: 262144, name: unknown_0x40000, label: "Unknown for bootable content; patch overwrite flag in patch context", source: psdevwiki, confidence: speculative }
          - { mask: 524288, name: game_purchase_enabled, label: "Game Purchase Enabled", source: psdevwiki, confidence: confirmed }
          - { mask: 1048576, name: license_related, label: "License related behavior", source: psdevwiki, confidence: speculative }
          - { mask: 2097152, name: pcengine, label: "PCEngine", source: psdevwiki, confidence: speculative }
          - { mask: 4194304, name: license_logo_disabled, label: "License Logo Disabled", source: psdevwiki, confidence: confirmed }
          - { mask: 8388608, name: move_controller_enabled, aliases: [ps_move_support], label: "Move Controller Enabled / PS Move support; corroborated by RPCS3 game_list_table.cpp", source: psdevwiki, confidence: confirmed }
          - { mask: 16777216, name: emulator_type_bit0, label: "Emulator type field bit 0", source: psdevwiki, confidence: speculative }
          - { mask: 33554432, name: emulator_type_bit1, label: "Emulator type field bit 1", source: psdevwiki, confidence: speculative }
          - { mask: 67108864, name: neogeo_emulator_type, label: "NeoGeo emulator type field value X4; requires PCEngine", source: psdevwiki, confidence: confirmed }
          - { mask: 134217728, name: reserved_0x8000000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 268435456, name: reserved_0x10000000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 536870912, name: reserved_0x20000000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 1073741824, name: reserved_0x40000000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
          - { mask: 2147483648, name: reserved_0x80000000, label: "Not Used Yet", source: psdevwiki, confidence: reserved }
        fields:
          - { mask: 117440512, name: emulator_type_field, label: "3-bit X1..X7 emulator type field; X4 is NeoGeo", source: psdevwiki, confidence: speculative }
        flag_tables:
          - id: subfolder
            label: Disc subfolder
            source: psdevwiki
            confidence: confirmed
            notes: "CATEGORY TR/VR/DP/XR; PSDevWiki text lines 1193-1305 and 1393-1406."
            flags:
              - { mask: 1, name: subfolder_enabled, label: "Subfolder enabled", source: psdevwiki, confidence: confirmed }
          - id: patch
            label: Patch
            source: psdevwiki
            confidence: confirmed
            notes: "CATEGORY GD update packages with APP_VER/TARGET_APP_VER; PSDevWiki text lines 1407-1428."
            flags:
              - { mask: 262144, name: overwrite_resolution_sound_remoteplay, label: "Overwrite RESOLUTION, SOUND_FORMAT and remote-play flags from the base SFO", source: psdevwiki, confidence: confirmed }
              - { mask: 1048576, name: overwrite_xmb_ingame, label: "Overwrite XMB In-Game flags 0x8/0x10/0x20", source: psdevwiki, confidence: confirmed }
              - { mask: 2097152, name: overwrite_move_warning, label: "Expected to overwrite Move/Nav/PS Eye warning flags", source: psdevwiki, confidence: speculative }
              - { mask: 4194304, name: overwrite_3d_warning, label: "Expected to overwrite stereoscopic 3D warning", source: psdevwiki, confidence: speculative }
              - { mask: 8388608, name: overwrite_move_enabled, label: "Expected to overwrite Move Controller Enabled", source: psdevwiki, confidence: speculative }
      - name: BOOTABLE
        format: integer
        max_len: 4
        default: "1"
        confidence: observed
        source: psl1ght-template
        behavior: "RPCS3 UI metadata only; BOOTABLE=0 still boots."
      - name: CATEGORY
        format: utf8
        max_len: 4
        default: "HG"
        confidence: confirmed
        source: rpcs3-category
        behavior: "Controls boot path and mounting; empty CATEGORY in a non-empty SFO aborts boot as corrupted."
      - name: LICENSE
        format: utf8
        max_len: 512
        confidence: observed
        source: psl1ght-template
        behavior: "Ignored by RPCS3; preserve."
      - name: CONTENT_ID
        format: utf8
        max_len: 48
        confidence: confirmed
        source: psdevwiki
        validation: "37 characters by PSDevWiki convention; our package content ID comes from the package header CLI."
        validation_confidence: observed
        behavior: "RPCS3 reads it for trial unlock checks on CATEGORY HG; our pkg.c does not consume it."
        notes: "Observed at max 48 in the Vita fixture."
      - name: NP_COMMUNICATION_ID
        format: utf8
        max_len: 16
        confidence: confirmed
        source: psdevwiki
        validation: "13 characters by PSDevWiki convention."
        validation_confidence: observed
        behavior: "No RPCS3 behavior found; preserve."
        notes: "Observed at max 16 in the Vita fixture."
      - name: REGION_DENY
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "No RPCS3 behavior found; PSDevWiki says bit n set denies region n for HDD games, firmware 3.30."
        flags:
          - { mask: 1, name: japan, label: "Japan denied", source: psdevwiki, confidence: confirmed }
          - { mask: 2, name: us_canada, label: "US/Canada denied", source: psdevwiki, confidence: confirmed }
          - { mask: 4, name: europe_middle_east_africa, label: "Europe/Middle East/Africa denied", source: psdevwiki, confidence: confirmed }
          - { mask: 8, name: korea, label: "Korea denied", source: psdevwiki, confidence: confirmed }
          - { mask: 16, name: uk_ireland, label: "UK/Ireland denied", source: psdevwiki, confidence: confirmed }
          - { mask: 32, name: mexico_central_south_america, label: "Mexico/Central and South America denied", source: psdevwiki, confidence: confirmed }
          - { mask: 64, name: australia_new_zealand, label: "Australia/New Zealand denied", source: psdevwiki, confidence: confirmed }
          - { mask: 128, name: singapore_malaysia, label: "Singapore/Malaysia denied", source: psdevwiki, confidence: confirmed }
          - { mask: 256, name: taiwan, label: "Taiwan denied", source: psdevwiki, confidence: confirmed }
          - { mask: 512, name: russia_ukraine_india_central_asia, label: "Russia/Ukraine/India/Central Asia denied", source: psdevwiki, confidence: confirmed }
          - { mask: 1024, name: china, label: "China denied", source: psdevwiki, confidence: confirmed }
          - { mask: 2048, name: hong_kong, label: "Hong Kong denied", source: psdevwiki, confidence: confirmed }
      - name: TARGET_APP_VER
        format: utf8
        max_len: 6
        confidence: confirmed
        source: rpcs3-runtime
        validation: "NN.NN convention"
        validation_confidence: observed
        behavior: "For CATEGORY GD packages, exact-match install gate against the installed APP_VER."
      - name: GAMEDATA_ID
        format: utf8
        max_len: 32
        confidence: speculative
        source: psdevwiki
        behavior: "PSDevWiki lists it for game data; no RPCS3 behavior found, preserve."
        notes: "PSDevWiki marks this row with uncertainty."
      - name: PATCH_FILE_NAME
        format: unknown
        max_len: null
        confidence: gap
        source: psdevwiki-gap
        behavior: "No RPCS3 behavior found; preserve."
      - name: ITEM_PRIORITY
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "PSDevWiki lists it for CATEGORY 2G; no RPCS3 behavior found, preserve."
      - name: INSTALL_DIR
        format: unknown
        max_len: null
        confidence: gap
        source: psdevwiki-gap
        behavior: "No RPCS3 behavior found; package install destination comes from PKG metadata."
      - name: XMB_APPS
        format: unknown
        max_len: null
        confidence: gap
        source: psdevwiki-gap
        behavior: "No RPCS3 behavior found; preserve."
      - name: PARENTAL_LEVEL_A
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override for SCEA 01 / Americas."
      - name: PARENTAL_LEVEL_C
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override for SCH 05 / China."
      - name: PARENTAL_LEVEL_E
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override for SCEE 02 / Europe, Middle East, Africa, UK, Oceania and related regions."
      - name: PARENTAL_LEVEL_H
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override from PSDevWiki."
      - name: PARENTAL_LEVEL_J
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override from PSDevWiki."
      - name: PARENTAL_LEVEL_K
        format: integer
        max_len: 4
        confidence: confirmed
        source: psdevwiki
        behavior: "License-area parental level override from PSDevWiki."

  - id: savedata
    label: Savedata PARAM.SFO
    keys:
      - name: TITLE
        format: utf8
        max_len: 128
        confidence: confirmed
        source: sysutil-savedata
        notes: "Name from RPCS3 savedata generator; size from sysutil_savedata.h."
      - name: SUB_TITLE
        format: utf8
        max_len: 128
        confidence: confirmed
        source: sysutil-savedata
        notes: "Name from RPCS3 savedata generator; size from sysutil_savedata.h."
      - name: DETAIL
        format: utf8
        max_len: 1024
        confidence: confirmed
        source: sysutil-savedata
        notes: "Name from RPCS3 savedata generator; size from sysutil_savedata.h."
      - name: ATTRIBUTE
        format: integer
        max_len: 4
        confidence: confirmed
        source: sysutil-savedata
        behavior: "Savedata metadata bitfield generated and read separately from game ATTRIBUTE."
        notes: "Savedata ATTRIBUTE is separate from game PARAM.SFO ATTRIBUTE. Name from RPCS3 savedata generator; bit from sysutil_savedata.h; PSDevWiki labels the same bit Copy Protected."
        flags:
          - { mask: 1, name: no_duplicate, aliases: [copy_protected], label: "No duplicate / Copy Protected", source: sysutil-savedata, confidence: confirmed }
      - name: SAVEDATA_LIST_PARAM
        format: utf8
        max_len: 8
        confidence: confirmed
        source: sysutil-savedata
        validation: "[A-Z0-9-_] only in RPCS3 cellSaveData."
        notes: "Name from RPCS3 savedata generator; size from sysutil_savedata.h."
      - name: SAVEDATA_DIRECTORY
        format: utf8
        max_len: 32
        confidence: confirmed
        source: sysutil-savedata
        notes: "Name from RPCS3 savedata generator; size from sysutil_savedata.h."
      - name: PARAMS
        format: array
        max_len: 1024
        confidence: observed
        source: psdevwiki
        behavior: "Written blank by RPCS3 savedata generation; not read."
        notes: "PSDevWiki matrix says utf8-S / format 0x0004. RPCS3-generated savedata uses 0x0204 strings and marks those lines uncertain; preserve and accept either."
        variance: "RPCS3-generated savedata uses 0x0204 strings while PSDevWiki says utf8-S / format 0x0004."
      - name: PARAMS2
        format: array
        max_len: 12
        confidence: observed
        source: psdevwiki
        behavior: "Written blank by RPCS3 savedata generation; not read."
        notes: "PSDevWiki matrix says utf8-S / format 0x0004. RPCS3-generated savedata uses 0x0204 strings and marks those lines uncertain; preserve and accept either."
        variance: "RPCS3-generated savedata uses 0x0204 strings while PSDevWiki says utf8-S / format 0x0004."
      - name: ACCOUNT_ID
        format: array
        max_len: 16
        confidence: confirmed
        source: rpcs3-runtime
        behavior: "RPCS3 writes sixteen ASCII zero bytes when generating savedata."
      - name: PARENTAL_LEVEL
        format: integer
        max_len: 4
        confidence: confirmed
        source: rpcs3-runtime
      - name: CATEGORY
        format: utf8
        max_len: 4
        default: "SD"
        confidence: confirmed
        source: rpcs3-category
      - name: RPCS3_BLIST
        format: utf8
        max_len: null
        confidence: observed
        source: rpcs3-runtime
        notes: "RPCS3 extension for savedata file order; preserve and do not apply PS3 validation."
      - name: "*<filename>"
        format: integer
        max_len: 4
        confidence: observed
        source: rpcs3-runtime
        notes: "RPCS3 extension pattern for savedata secure-file flags; preserve and do not apply PS3 validation."

  - id: trophy
    label: Trophy PARAM.SFO
    keys:
      - name: TITLE
        format: utf8
        max_len: 128
        confidence: confirmed
        source: psdevwiki
        notes: "Trophy PARAM.SFO uses no CATEGORY."
      - name: LANG
        format: integer
        max_len: 4
