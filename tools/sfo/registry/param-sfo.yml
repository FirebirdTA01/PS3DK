sources:
  - id: rpcs3-psf
    label: RPCS3 Loader/PSF.cpp and PSF.h parser and writer behavior
    ref: "RPCS3 @ e426e444 rpcs3/Loader/PSF.cpp, rpcs3/Loader/PSF.h"
  - id: rpcs3-category
    label: RPCS3 rpcs3qt/category.h category names and PSF.cpp accept list
    ref: "RPCS3 @ e426e444 rpcs3/rpcs3qt/category.h:23-46; rpcs3/Loader/PSF.cpp category accept list"
  - id: rpcs3-runtime
    label: RPCS3 runtime consumers surveyed in System.cpp, cellGame.cpp, cellAudioOut.cpp, unpkg.cpp, and cellSaveData.cpp
    ref: "RPCS3 @ e426e444 Emu/System.cpp, cellGame.cpp, cellAudioOut.cpp, unpkg.cpp, cellSaveData.cpp"
  - id: rpcs3-game-list
    label: RPCS3 game_list_table.cpp observed game ATTRIBUTE bit usage citing PSDevWiki
    ref: "RPCS3 @ e426e444 rpcs3/rpcs3qt/game_list_table.cpp:338-339"
  - id: ps3dk-gamecontent
    label: sdk/include/cell/sysutil_gamecontent.h public cellGame parameter sizes
    ref: "PS3DK sdk/include/cell/sysutil_gamecontent.h:108-143"
  - id: sysutil-savedata
    label: sdk/include/cell/sysutil_savedata.h public savedata parameter sizes
    ref: "PS3DK sdk/include/cell/sysutil_savedata.h:63-64,96-99,189-190"
  - id: psl1ght-template
    label: PSL1GHT tools/sfo_pkg/sfo.xml defaults and current PS3DK template provenance
    ref: "PSL1GHT tools/sfo_pkg/sfo.xml @ 73e34af; tools/sfo-pkg/PROVENANCE.md:13"
  - id: sfo-c
    label: Current C sfo writer and on-PS3 TITLE_ID storage convention
    ref: "PS3DK tools/sfo-pkg/sfo.c:544-554; RPCS3 @ e426e444 cellGame.h:221; observed retail SFO"
  - id: vita-fixture
    label: User-owned Vita param.sfo preservation fixture observed locally, bytes not committed
    ref: "observed in a PS Vita param.sfo (19 keys, 912 B), 2026-08-30; not redistributed"
  - id: psdevwiki-gap
    label: PARAM.SFO keys whose public source data is still incomplete
    ref: "Rows intentionally preserved as unknown until a public source confirms their format or behavior"
  - id: psdevwiki
    label: PSDevWiki PARAM.SFO page saved by the director
    ref: "PSDevWiki PARAM.SFO, page saved 2026-08-30; local text lines cited in tools/sfo/registry/param-sfo.yml"

