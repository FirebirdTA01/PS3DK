  - { code: "AT", label: "Application TV", source: "psdevwiki" }
  - { code: "AV", label: "app video", source: "rpcs3-category" }
  - { code: "BV", label: "BC video", source: "rpcs3-category" }
  - { code: "WT", label: "Web TV", source: "psdevwiki" }
  - { code: "HM", label: "home", source: "rpcs3-category" }
  - { code: "CB", label: "network", source: "rpcs3-category" }
  - { code: "SF", label: "store frontend", source: "rpcs3-category" }
  - { code: "DG", label: "disc game", source: "rpcs3-category" }
  - { code: "HG", label: "HDD game", source: "rpcs3-category" }
  - { code: "2P", label: "PS2 game", source: "rpcs3-category" }
  - { code: "2G", label: "PS2 installed", source: "rpcs3-category" }
  - { code: "1P", label: "PS1 game", source: "rpcs3-category" }
  - { code: "PP", label: "PSP game", source: "rpcs3-category" }
  - { code: "MN", label: "PSP mini", source: "rpcs3-category" }
  - { code: "PE", label: "PSP remaster", source: "rpcs3-category" }
  - { code: "GD", label: "PS3 game data", source: "rpcs3-category" }
  - { code: "2D", label: "PS2 data", source: "rpcs3-category" }
  - { code: "SD", label: "PS3 save data", source: "rpcs3-category" }
