  host-tools-windows:
    name: Host tools build (windows mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v5

      - name: Test shader-differential current census helpers
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\container-metrics-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\current-census-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\current-gap-summary-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\reference-tree-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\stage-roots-test.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\manifest-controls-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\shipped-coverage-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\path-pair-corpus-inputs-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSYS2 / mingw64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-python
            mingw-w64-x86_64-rust

      - name: Test sampler refusal with the configured native compiler
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/regression/shader-differential/sampler-kind-refusal-test.ps1 -CCompiler gcc

      - name: cargo build (windows)
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: Build sprx-linker (static)
        run: |
          set -e
          cd tools/sprx-linker
          gcc -O2 -Wall -std=gnu99 -static -o sprxlinker.exe sprx-linker.c \
              -lelf -lz -lzstd

      - name: Build rsx-cg-compiler (static)
        run: |
          set -e
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler

      - name: Validate --version
        run: |
          set -e
          tools/rsx-cg-compiler/build/rsx-cg-compiler.exe --version
          file tools/sprx-linker/sprxlinker.exe
