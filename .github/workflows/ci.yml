name: CI

on:
  push:
    branches: [main, cg-compiler-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-pipeline:
    name: Version pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: scripts/version.sh — all formats
        run: |
          ./scripts/version.sh --format=plain
          ./scripts/version.sh --format=bare
          ./scripts/version.sh --format=cmake
          ./scripts/version.sh --format=header
          ./scripts/version.sh --format=json

      - name: scripts/sync-versions.sh --dry-run
        run: ./scripts/sync-versions.sh --dry-run

  rust-tools:
    name: Rust tools build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('tools/Cargo.lock') }}

      - name: cargo build
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: cargo test
        working-directory: tools
        run: cargo test --workspace

      # The release workflow runs every shipped tool with --version and fails
      # the release on one that rejects it; check the same list here.
      - name: Every shipped Rust tool answers --version
        run: |
          bins="$(./scripts/list-rust-bins.sh)"
          [ -n "$bins" ] || { echo "::error::list-rust-bins.sh listed no binaries"; exit 1; }
          for bin in $bins; do
            "tools/target/debug/$bin" --version
          done

  host-tools-cxx:
    name: C/C++ host tools build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libelf-dev cmake ninja-build python3

      - name: Build sprx-linker
        run: make -C tools/sprx-linker

      - name: Build rsx-cg-compiler
        run: |
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler cgnv2elf

      - name: Validate rsx-cg-compiler --version
        run: |
          tools/rsx-cg-compiler/build/rsx-cg-compiler --version
          tools/rsx-cg-compiler/build/cgnv2elf --version

      # A second rsx-cg-compiler on a DIFFERENT compiler and standard library
      # (clang + libc++).  Output that depends on unordered_* iteration order,
      # on undefined behaviour, or on a compiler's miscompile shows up as a
      # container difference against the gcc/libstdc++ build above.  Two
      # libstdc++ builds would agree with each other with the defect present.
      - name: Build rsx-cg-compiler (clang + libc++)
        run: |
          sudo apt-get install -y --no-install-recommends clang libc++-dev libc++abi-dev
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build-libcxx \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          cmake --build tools/rsx-cg-compiler/build-libcxx --target rsx-cg-compiler

      - name: Test rsx-cg-compiler output is independent of the C++ toolchain
        run: bash tests/shader-compiler/cross-stl-determinism-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler tools/rsx-cg-compiler/build-libcxx/rsx-cg-compiler

      - name: Test a vertex-program pow() of a vector computes every lane
        run: bash tests/shader-compiler/vp-pow-vector-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test vertex reflect float3 values and width refusal boundaries
        run: bash tests/shader-compiler/vp-reflect-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test vertex lerp delta order, endpoints and explicit contraction debt
        run: bash tests/shader-compiler/vp-lerp-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex coissue shared-source value regression
        run: bash tests/shader-compiler/vp-coissue-source-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex normalize float3 and float4 value regression
        run: bash tests/shader-compiler/vp-normalize-width-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex refract values and strict boundary comparison controls
        run: bash tests/shader-compiler/vp-refract-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test a run-time index into a vector is refused like the reference
        run: bash tests/shader-compiler/runtime-vector-selector-refusal-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Check every tracked test has a CI invocation
        run: python3 tests/ci-test-list-test.py

      - name: Test shader-compiler suite runner self-check
        run: bash tests/shader-compiler/suite-runner-test.sh

      - name: Test the SDK's fragment-program control word builder
        run: bash tests/sdk/fp-control-word-test.sh

      - name: Test PPU header hygiene ratchet and install ownership
        run: |
          python3 tests/sdk/ppu-header-hygiene-test.py --self-test
          python3 tests/sdk/psl1ght-header-install-order-test.py
          if [ -n "${PS3DEV:-}" ] && [ -x "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++" ]; then
            output=$(mktemp -d)/header-probes
            python3 tests/sdk/ppu-header-hygiene-test.py --ps3dev "$PS3DEV" --output "$output"
          else
            echo 'SKIP target PPU header probes: PS3DEV cross toolchain unavailable; only host self-tests ran'
          fi

      - name: Test Cg resource enum consumers and runtime values
        run: bash tests/sdk/gcm-cg-resource-test.sh

      # Freestanding 32-bit compilation catches the original ILP32 shift
      # without requiring a PPU toolchain or host multilib runtime libraries.
      # Native host execution also verifies the wide-pointer debug trap.
      - name: Test LV2 effective-address conversions
        run: |
          gcc -m32 -ffreestanding -std=c11 -Wall -Wextra -Werror -DEXPECT_POINTER_SIZE=4 -Isdk/include -fsyntax-only tests/sdk/lv2-ea32-test.c
          g++ -m32 -ffreestanding -std=c++17 -Wall -Wextra -Werror -DEXPECT_POINTER_SIZE=4 -Isdk/include -fsyntax-only tests/sdk/lv2-ea32-test.c
          bash tests/sdk/lv2-ea32-test.sh

      # Including <sys/process.h> and <sys/sys_time.h> in either order must not
      # trigger lv2syscall0..8 or register_passing_1..7 redefinitions (t_38a797a0).
      - name: Test lv2syscall macro definition compatibility across header orders
        run: bash tests/sdk/lv2syscall-redefined-test.sh

      # sys_spu_thread_argument_t must use canonical arg1..arg4 matching SPU
      # registers $3..$6 while preserving sysSpuThreadArgument arg0..arg3.
      - name: Test SPU thread argument structure layout and compatibility
        run: bash tests/sdk/spu-thread-argument-test.sh

      # sys_lwmutex and sys_lwcond in <sys/synchronization.h> must declare
      # canonical attributes, structures, and function prototypes.
      - name: Test lightweight mutex and condition variable synchronization
        run: bash tests/sdk/lwmutex-synchronization-test.sh

      # Skips without PS3DEV; rwlock, semaphore, cond signal-to, event-queue
      # try-receive, name setters and sync constants, pinned by value.
      - name: Test the sys_ synchronisation surface
        run: bash tests/sdk/sys-sync-surface-test.sh

      # Skips without PS3DK; with an installed SDK, ps3_add_spu_image must
      # refuse a SPURS job image that has no _start.
      - name: Test the SPURS job image entry guard
        run: bash tests/sdk/spu-jobbin-entry-guard-test.sh

      - name: Test the generated GCM C++ command context is current
        run: bash tests/sdk/gcm-context-cpp-test.sh

      - name: Test librt pthread_mutex_trylock returns POSIX EBUSY
        run: bash tests/sdk/librt-trylock-ebusy-test.sh

      # The GCM FIFO wrap must retire a lap the application never published
      # (t_38e8bf5a): a host model of the RSX fetcher runs the protocol, and
      # the one-phase protocol it replaced must fail the idle-lap scenario.
      - name: Test the GCM FIFO wrap never loses an unpublished lap
        run: bash tests/sdk/fifo-wrap-protocol-test.sh

      # The SPU libsheap core is portable C: the host build checks the heap
      # layout the firmware shares, the tree bits, the allocation rules, the
      # key-table state machine and a random run against a bitmap model.
      - name: Test the shared-heap core layout, allocator and key table
        run: bash tests/sdk/sheap-core-host-test.sh

      # libdaisy ports on the host: a cancelled push or pop comes back on the
      # port's next begin while other ends hold later entries, and the
      # COPY / REFERENCE forms and COPY-mode cancel misuse fail to compile.
      - name: Test libdaisy port cancel semantics and mode checks
        run: bash tests/sdk/daisy-pipe-host-test.sh

      # The simdmath f4fast forms on the host: each form over its documented
      # domain against double-precision libm, with 12-bit estimates.
      - name: Test simdmath fast-form accuracy
        run: bash tests/sdk/simdmath-fast-host-test.sh

      # The SPU libsync sources over a simulated MFC: queue and rwm
      # descriptors survive Initialize, the mutex is the PPU's ticket word
      # (checked against a PPU-side model), barrier counts are validated.
      - name: Test the SPU libsync queue, rwm, mutex and barrier on the host
        run: bash tests/sdk/libsync-spu-host-test.sh

      # The SPU libsync2 waiting queue over a simulated MFC, two local
      # stores sharing one queue: FIFO wake-ups, the wake-before-entry
      # marker and both phase bits across wraps, then again with every
      # other conditional store lost.
      - name: Test the SPU libsync2 waiting queue on the host
        run: bash tests/sdk/sync2-waiting-queue-host-test.sh

      # install-headers copies an explicit list; a header missing from it is
      # left out of the installed SDK and breaks the full SDK build.
      - name: Test every tracked SDK header is installed
        run: bash tests/sdk/sdk-header-list-test.sh

      # No PPU toolchain on this runner, so only the host-only checks (A and
      # D) run here; the archive checks (B and C) skip themselves and are
      # run by scripts/build-cell-stub-archives.sh against the tree it has
      # just installed, which is the only context where they can execute.
      - name: Test the legacy gcm* surface is fully defined
        run: bash tests/sdk/gcm-legacy-symbol-coverage-test.sh

      # Every reference stub-archive database is built under its reference
      # name.  Only the host check (A) runs here; the installed-archive check
      # (B) needs a built tree and runs from build-cell-stub-archives.sh.
      - name: Test every reference stub archive name is built
        run: bash tests/sdk/reference-stub-archive-names-test.sh

      # sdk_version.h defines CELL_SDK_VERSION and is installed for SPU too.
      # Only the host install check (A) runs here; B needs an installed SDK.
      - name: Test sdk_version.h reaches PPU and SPU with CELL_SDK_VERSION
        run: bash tests/sdk/sdk-version-header-test.sh

      # A render target's type field takes the SURFACE family, never the
      # texture-filter family. The mixup compiled, passed RPCS3, and hung a
      # real PS3 on a black screen; 23 samples and our own PSGL carried it.
      - name: Test render-target surface types use the surface enum family
        run: bash tests/sdk/surface-type-enum-test.sh

      # ps3_add_self must respect OUTPUT_DIRECTORY keyword and PS3_SELF_OUTPUT_DIRECTORY
      # variable, falling back to CMAKE_CURRENT_SOURCE_DIR by default. ps3_add_pkg
      # must follow the same resolved directory.
      - name: Test ps3_add_self output directory override
        run: bash tests/sdk/cmake-self-output-dir-test.sh

      # A target that opts into LP64 with -mlp64 must be post-linked with
      # sprxlinker --lp64, as the LP64 toolchain file does for whole projects.
      - name: Test ps3_add_self post-links -mlp64 targets for LP64
        run: bash tests/sdk/cmake-self-lp64-postlink-test.sh

      - name: Test librt pathname limits and error propagation
        run: bash tests/sdk/librt-pathconf-test.sh

      - name: Test librt joins relative paths to the working directory verbatim
        run: bash tests/sdk/librt-resolve-path-host-test.sh

      - name: Test libdma splits large and unaligned transfers into legal MFC commands
        run: bash tests/sdk/libdma-split-host-test.sh

      - name: Test librt heap configuration and failure diagnostics
        run: bash tests/sdk/librt-heap-test.sh

      - name: Test librt low-level exit and finalizer registration
        run: bash tests/sdk/librt-exit-test.sh

      - name: Test librt stat and fstat report EOVERFLOW for sizes beyond off_t
        run: bash tests/sdk/librt-fstat-eoverflow-test.sh

      - name: Test POSIX clocks sleep and scheduling attributes
        run: python3 tests/sdk/posix-time-host-test.py

      - name: Test POSIX time declarations and links when cross SDK is available
        run: python3 tests/sdk/posix-time-cross-test.py

      - name: Test audio compatibility alias ownership when cross SDK is available
        run: python3 tests/sdk/audio-alias-link-test.py

      - name: Test SPURS task entry argument and exit-code forwarding
        run: python3 tests/sdk/spurs-task-entry-host-test.py

      - name: Test SPURS task entry links when cross SDK is available
        run: python3 tests/sdk/spurs-task-entry-cross-test.py

      - name: Test SPURS driver selection and startup ownership
        run: |
          python3 tests/sdk/spurs-driver-trace-test.py
          python3 tests/sdk/spurs-startup-ownership-test.py
          python3 tests/sdk/spurs-driver-link-test.py
          python3 tests/sdk/spurs-linker-mode-test.py
          python3 tests/sdk/spurs-guid-reservation-test.py
          python3 tests/sdk/spurs-common-archive-test.py
          python3 tests/sdk/spu-shared-refusal-test.py

      - name: Test SPU nop opcode and dotted directive dispatch
        run: python3 tests/sdk/spu-nop-dispatch-test.py

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test AltiVec keywords under a strict -std=
        run: bash tests/sdk/altivec-strict-std-test.sh

      # Skips without PS3DEV; with a PPU compiler, the ILP32 reproducer must
      # form no address from an untruncated 32-bit reload (GCC patch 0049).
      - name: Test ILP32 address formation in the IV-spill reproducer
        run: bash tests/sdk/ilp32-ivspill-codegen-test.sh

      # The red control always runs; with a PPU compiler, every counted loop's
      # CTR count must have a defined upper half (GCC patch 0050).
      - name: Test ILP32 counted-loop CTR counts
        run: bash tests/sdk/ilp32-doloop-codegen-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test -mminimal-toc in both PPU ABIs
        run: bash tests/sdk/minimal-toc-ilp32-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test the SDK stdarg.h wrapper forwards on every inclusion
        run: bash tests/sdk/stdarg-reentry-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test SPU code can include the C++ vector math headers
        run: bash tests/sdk/spu-vectormath-include-test.sh

      # Skips without PS3DEV; checks the installed SPU libatomic.a.
      - name: Test the SPU libatomic archive defines every operation
        run: bash tests/sdk/spu-libatomic-test.sh

      # Skips without PS3DEV; checks the installed SPU libsheap.a and links
      # a program calling its whole API.
      - name: Test the SPU libsheap archive exports and links its API
        run: bash tests/sdk/spu-sheap-link-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test SPU C++ parenthesised vector literals and casts
        run: bash tests/sdk/spu-paren-vector-cpp-test.sh

      # Skips without PS3DEV; compiles this tree's SPU atomic header in C/C++.
      - name: Test SPU atomic alignment predicates select integer intrinsics
        run: bash tests/sdk/spu-atomic-overload-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test the reference PS3 platform macros are predefined
        run: bash tests/sdk/platform-predefines-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test the SPU SPURS headers declare the EA API and keep the PPU API
        run: bash tests/sdk/spurs-spu-header-surface-test.sh

      # Skips without PS3DEV; compiles this tree's GCM headers under -Werror.
      - name: Test the GCM headers define each macro once
        run: bash tests/sdk/gcm-redefinition-test.sh

      # Always executes the real header's value assertions in C11 and C++17.
      - name: Test the sysmodule ids on the host
        run: bash tests/sdk/sysmodule-ids-test.sh --host

      # Additional target-header check when a PPU toolchain is available.
      - name: Test the sysmodule ids with the PPU compiler
        run: bash tests/sdk/sysmodule-ids-test.sh

      # Skips without PS3DEV; compiles and links every SPU cellDma name.
      - name: Test the SPU cellDma surface compiles and links
        run: bash tests/sdk/spu-celldma-api-test.sh

      # Skips without PS3DEV; compiles this tree's PRX headers in every order.
      - name: Test the PRX headers work alone and in either order
        run: bash tests/sdk/prx-headers-test.sh

      # pkg host tool must handle long paths (>512 chars POSIX, >260 Win32),
      # fail non-zero without writing packages when files cannot be read, and
      # produce byte-identical packages for standard payloads.
      - name: Test pkg host tool long paths and error handling
        run: bash tests/sdk/pkg-test.sh

      - name: Test Linux pkg installation and release staging
        run: bash tests/sdk/linux-pkg-install-test.sh

      - name: Test newlib remove directory fallback
        run: bash tests/sdk/newlib-remove-test.sh

      - name: Test rsx-cg-compiler operator lexing
        run: bash tests/shader-compiler/operator-lexer-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler angle stdlib
        run: bash tests/shader-compiler/stdlib-angle-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler log10 stdlib
        run: bash tests/shader-compiler/stdlib-log10-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler smoothstep stdlib
        run: bash tests/shader-compiler/stdlib-smoothstep-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler atan2 stdlib
        run: bash tests/shader-compiler/stdlib-atan2-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler trig polynomial stdlib
        run: bash tests/shader-compiler/stdlib-trig-poly-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler derivatives stdlib
        run: bash tests/shader-compiler/stdlib-derivatives-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler DIVR opcode
        run: bash tests/shader-compiler/divr-opcode-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Scalar local initializers broadcast to vectors once
        run: bash tests/shader-compiler/scalar-vector-decl-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Helper struct annotations do not bind entry inputs
        run: bash tests/shader-compiler/helper-struct-semantic-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Vertex division scalar-unit guard
        run: bash tests/shader-compiler/vp-division-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Packed depth texture decode guard
        run: bash tests/shader-compiler/texdepth-decode-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test source swizzle composition in both shader profiles
        run: bash tests/shader-compiler/local-swizzle-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler user-function inlining
        run: bash tests/shader-compiler/user-function-inline-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler write masks
        run: bash tests/shader-compiler/write-mask-clobber-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler refusal semantics
        run: bash tests/shader-compiler/refusal-semantics-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler control-flow flatten
        run: bash tests/shader-compiler/control-flow-flatten-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler static loop unroll
        run: bash tests/shader-compiler/static-loop-unroll-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test empty statements and surrounding control flow
        run: bash tests/shader-compiler/empty-statement-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Static loop expansion twins
        run: bash tests/shader-compiler/static-loop-expansion-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Helper static loop expansion twins
        run: bash tests/shader-compiler/helper-static-loop-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Member array stores and current selectors
        run: bash tests/shader-compiler/member-array-store-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler file-scope const folding
        run: bash tests/shader-compiler/const-fold-value-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler static const qualifiers
        run: bash tests/shader-compiler/static-const-qualifier-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test array uniforms are laid out one element at a time
        run: bash tests/shader-compiler/array-uniform-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test vertex array uniforms indexed at run time
        run: bash tests/shader-compiler/vp-array-dynamic-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test vertex matrix-array records and indexed row reads
        run: bash tests/shader-compiler/vp-matrix-array-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: VP matrix arithmetic
        run: bash tests/shader-compiler/vp-matrix-arithmetic-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test two-column vertex matrix-vector reductions
        run: bash tests/shader-compiler/vp-matvec2-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test one-dimensional float matrix values and uniform rows
        run: bash tests/shader-compiler/one-dimensional-matrix-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test explicit vertex bindings match decoded register reads
        run: bash tests/shader-compiler/vp-explicit-binding-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test fragment binding metadata preserves inline constants and relocations
        run: bash tests/shader-compiler/fp-explicit-binding-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler uniform patch lanes
        run: bash tests/shader-compiler/uniform-patch-lane-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler uniform compiled defaults
        run: bash tests/shader-compiler/uniform-compiled-default-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test file-scope uniform defaults reach the container parameter table
        run: bash tests/shader-compiler/uniform-default-reflection-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test matrix reflection - const fold, parent and row types, row defaults
        run: bash tests/shader-compiler/matrix-reflection-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Cross-check uniform records against encoded reads and inline defaults
        run: bash tests/shader-compiler/uniform-container-crosscheck-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test entry-parameter default values - acceptance, refusals, entry swap
        run: bash tests/shader-compiler/entry-param-default-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler texcoord 2D flags
        run: bash tests/shader-compiler/texcoord-2d-flags-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler TEXCOORD8/9 masks
        run: bash tests/shader-compiler/texcoord-89-mask-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler discard completeness
        run: bash tests/shader-compiler/discard-completeness-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler discard guards
        run: bash tests/shader-compiler/discard-guard-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler texobj types and unknown type names
        run: bash tests/shader-compiler/texobj-and-unknown-type-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test cgnv2elf shader archives
