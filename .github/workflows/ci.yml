name: CI

on:
  push:
    # feat/gcc16 is the GCC 16 integration branch until the switchover
    # release: its pushes run the same checks as main's.
    branches: [main, cg-compiler-dev, feat/gcc16]
  pull_request:
    branches: [main, feat/gcc16]

permissions:
  contents: read

jobs:
  version-pipeline:
    name: Version pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: scripts/version.sh — all formats
        run: |
          ./scripts/version.sh --format=plain
          ./scripts/version.sh --format=bare
          ./scripts/version.sh --format=cmake
          ./scripts/version.sh --format=header
          ./scripts/version.sh --format=json

      - name: scripts/sync-versions.sh --dry-run
        run: ./scripts/sync-versions.sh --dry-run

      # tools/VERSION must be exactly X.Y.Z and a newline: the Rust tools embed it.
      - name: Test sync-versions.sh keeps tools/VERSION canonical
        run: bash tests/sdk/sync-versions-test.sh

      # The pre-release gate's scripts check their parsers on built-in fixtures.
      - name: Self-test leakscan.py and compare-builds.py
        run: |
          python3 scripts/leakscan.py --self-test
          python3 scripts/compare-builds.py --self-test

  shellcheck:
    name: ShellCheck ratchet over scripts/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pin the exact shellcheck the baseline was generated with so the rule
      # set is deterministic across runs and distros (a different version can
      # flag, or fail to flag, different codes and break the ratchet).
      # Install into $RUNNER_TEMP so no sudo is required; publish it to
      # PATH via GITHUB_PATH so the Version and Ratchet steps see it.
      # The tarball is additionally pinned by sha256 so a tampered download
      # or a re-published release-asset with the same version fails the
      # version-check step rather than the ratchet silently passing on a
      # different binary.
      - name: Install shellcheck 0.10.0
        env:
          SHELLCHECK_VERSION: 0.10.0
          SHELLCHECK_TARBALL_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dest"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          # Verify the tarball against the pinned sha256. A tampered or
          # substituted release-asset (same URL, different bytes) fails the
          # step here and not later inside the ratchet.
          echo "${SHELLCHECK_TARBALL_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c
          # The 0.10.0 tarball extracts to  shellcheck-v{ver}/shellcheck
          # at its root level, not shellcheck-v{ver}/bin/shellcheck.
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          cp "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$dest/shellcheck"
          chmod +x "$dest/shellcheck"
          printf '%s\n' "$dest" >> "$GITHUB_PATH"
      # Confirm the installed binary actually reports 0.10.0 before
      # running the ratchet, so a partial or corrupt download fails here
      # instead of producing a green-with-wrong-tool run.
      - name: Version
        run: |
          actual=$(shellcheck --version 2>&1 | awk 'NR==2{print $2}')
          if [ "$actual" != "0.10.0" ]; then
            echo "FAIL: shellcheck reports $actual, baseline was generated with 0.10.0"
            exit 1
          fi
          shellcheck --version

      # Ratchet: fails on any finding not already recorded in
      # ci/shellcheck-baseline.txt, so the tree only ever gets cleaner.
      # It self-checks that this shellcheck can flag an unquoted variable,
      # so a stubbed runner fails closed instead of passing silently.
      - name: Run the ratchet over scripts/**/*.sh
        run: bash ci/shellcheck.sh

  rust-tools:
    name: Rust tools build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('tools/Cargo.lock') }}

      - name: cargo build
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: cargo test
        working-directory: tools
        run: cargo test --workspace

      # The release workflow runs every shipped tool with --version and fails
      # the release on one that rejects it; check the same list here.
      - name: Every shipped Rust tool answers --version
        run: |
          bins="$(./scripts/list-rust-bins.sh)"
          [ -n "$bins" ] || { echo "::error::list-rust-bins.sh listed no binaries"; exit 1; }
          for bin in $bins; do
            "tools/target/debug/$bin" --version
          done

  host-tools-cxx:
    name: C/C++ host tools build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libelf-dev cmake ninja-build python3

      - name: Build sprx-linker
        run: make -C tools/sprx-linker

      # Calls to LP64 import stubs get their TOC restore with or without
      # --lp64; calls to ILP32 stubs are never touched.
      - name: Test sprxlinker TOC restores
        run: bash tests/sdk/sprxlinker-toc-restore-test.sh

      - name: Build rsx-cg-compiler
        run: |
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler cgnv2elf

      - name: Validate rsx-cg-compiler --version
        run: |
          tools/rsx-cg-compiler/build/rsx-cg-compiler --version
          tools/rsx-cg-compiler/build/cgnv2elf --version

      - name: Build psgl-shader-builder
        run: |
          ver="$(tr -d ' \t\r\n' < tools/VERSION)"
          gcc -std=c11 -O2 -Wall \
              -DPSGL_SHADER_BUILDER_VERSION="\"$ver\"" \
              -I sdk/libPSGL/src \
              tools/psgl-shader-builder/psgl_shader_builder.c \
              sdk/libPSGL/src/ffp_emit.c \
              -o tools/psgl-shader-builder/psgl-shader-builder
          tools/psgl-shader-builder/psgl-shader-builder --version

      - name: Test rsx-cg-compiler --psgl-ffp-library and the builder wrapper
        run: |
          python3 tests/host/psgl-ffp-library-test.py \
              --rsxcg tools/rsx-cg-compiler/build/rsx-cg-compiler \
              --builder tools/psgl-shader-builder/psgl-shader-builder

      # A second rsx-cg-compiler on a DIFFERENT compiler and standard library
      # (clang + libc++).  Output that depends on unordered_* iteration order,
      # on undefined behaviour, or on a compiler's miscompile shows up as a
      # container difference against the gcc/libstdc++ build above.  Two
      # libstdc++ builds would agree with each other with the defect present.
      - name: Build rsx-cg-compiler (clang + libc++)
        run: |
          sudo apt-get install -y --no-install-recommends clang libc++-dev libc++abi-dev
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build-libcxx \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          cmake --build tools/rsx-cg-compiler/build-libcxx --target rsx-cg-compiler

      - name: Test rsx-cg-compiler output is independent of the C++ toolchain
        run: bash tests/shader-compiler/cross-stl-determinism-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler tools/rsx-cg-compiler/build-libcxx/rsx-cg-compiler

      - name: Test a vertex-program pow() of a vector computes every lane
        run: bash tests/shader-compiler/vp-pow-vector-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test vertex reflect float3 values and width refusal boundaries
        run: bash tests/shader-compiler/vp-reflect-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test vertex lerp delta order, endpoints and explicit contraction debt
        run: bash tests/shader-compiler/vp-lerp-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex coissue shared-source value regression
        run: bash tests/shader-compiler/vp-coissue-source-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex normalize float3 and float4 value regression
        run: bash tests/shader-compiler/vp-normalize-width-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Vertex refract values and strict boundary comparison controls
        run: bash tests/shader-compiler/vp-refract-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test a run-time index into a vector is refused like the reference
        run: bash tests/shader-compiler/runtime-vector-selector-refusal-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test uppercase swizzles are refused like the reference
        run: bash tests/shader-compiler/uppercase-swizzle-refusal-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test a missing entry point is refused cleanly on both profiles
        run: bash tests/shader-compiler/missing-entry-refusal-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Check every tracked test has a CI invocation
        run: python3 tests/ci-test-list-test.py

      - name: Test shader-compiler suite runner self-check
        run: bash tests/shader-compiler/suite-runner-test.sh

      - name: Test the SDK's fragment-program control word builder
        run: bash tests/sdk/fp-control-word-test.sh

      - name: Test PPU header hygiene ratchet and install ownership
        run: |
          python3 tests/sdk/ppu-header-hygiene-test.py --self-test
          python3 tests/sdk/psl1ght-header-install-order-test.py
          if [ -n "${PS3DEV:-}" ] && [ -x "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++" ]; then
            output=$(mktemp -d)/header-probes
            python3 tests/sdk/ppu-header-hygiene-test.py --ps3dev "$PS3DEV" --output "$output"
          else
            echo 'SKIP target PPU header probes: PS3DEV cross toolchain unavailable; only host self-tests ran'
          fi

      - name: Test Cg resource enum consumers and runtime values
        run: bash tests/sdk/gcm-cg-resource-test.sh

      # Freestanding 32-bit compilation catches the original ILP32 shift
      # without requiring a PPU toolchain or host multilib runtime libraries.
      # Native host execution also verifies the wide-pointer debug trap.
      - name: Test LV2 effective-address conversions
        run: |
          gcc -m32 -ffreestanding -std=c11 -Wall -Wextra -Werror -DEXPECT_POINTER_SIZE=4 -Isdk/include -fsyntax-only tests/sdk/lv2-ea32-test.c
          g++ -m32 -ffreestanding -std=c++17 -Wall -Wextra -Werror -DEXPECT_POINTER_SIZE=4 -Isdk/include -fsyntax-only tests/sdk/lv2-ea32-test.c
          bash tests/sdk/lv2-ea32-test.sh

      # Including <sys/process.h> and <sys/sys_time.h> in either order must not
      # trigger lv2syscall0..8 or register_passing_1..7 redefinitions (t_38a797a0).
      - name: Test lv2syscall macro definition compatibility across header orders
        run: bash tests/sdk/lv2syscall-redefined-test.sh

      # sys_spu_thread_argument_t must use canonical arg1..arg4 matching SPU
      # registers $3..$6 while preserving sysSpuThreadArgument arg0..arg3.
      - name: Test SPU thread argument structure layout and compatibility
        run: bash tests/sdk/spu-thread-argument-test.sh

      # sys_lwmutex and sys_lwcond in <sys/synchronization.h> must declare
      # canonical attributes, structures, and function prototypes.
      - name: Test lightweight mutex and condition variable synchronization
        run: bash tests/sdk/lwmutex-synchronization-test.sh

      # Skips without PS3DEV; rwlock, semaphore, cond signal-to, event-queue
      # try-receive, name setters and sync constants, pinned by value.
      - name: Test the sys_ synchronisation surface
        run: bash tests/sdk/sys-sync-surface-test.sh

      # Skips without PS3DEV; every SDK header that compiles as C++ under
      # gnu++17 must still compile under gnu++20, ILP32 and LP64.
      - name: Test SDK headers for C++20 readiness
        run: bash tests/host/cxx20-header-test.sh

      # The C++20 probe's own guards: stub compilers that reject or accept
      # everything must be reported as infrastructure failures, not OK.
      - name: Self-test the C++20 header probe's controls
        run: sh tests/host/cxx20-header-test.sh --self-test

      # Skips without PS3DEV; LV2 timers 70-76 and the sleeps 141/142 by
      # syscall number, and sys_time_get_system_time as the import.
      - name: Test the LV2 timer surface
        run: bash tests/sdk/sys-timer-surface-test.sh

      # Skips without PS3DEV; sys_vm_* 300-312, page attribute 351, container
      # size 343 by syscall number, the five mmapper memory calls as imports.
      - name: Test the LV2 virtual-memory surface
        run: bash tests/sdk/sys-vm-surface-test.sh

      # Skips without PS3DEV; sizeof/offsetof/alignof of the cellFs records
      # (natural-aligned AIO request and ring buffer) in both data models.
      - name: Test the cellFs record layouts
        run: bash tests/sdk/cellfs-struct-layout-test.sh

      - name: Test the cell/hash digests against hashlib
        run: bash tests/sdk/hash-vectors-test.sh

      # Skips without PS3DEV; the random-number, spinlock and mempool
      # helpers (sys/random_number.h, sys/spinlock.h, sys/mempool.h) each of
      # whose eleven functions is a sysPrxForUser import (a call, not an sc),
      # compile clean in C/C++17 in both data models, and the RANDOM_NUMBER_MAX_SIZE
      # redefinition check against <lv2/system.h> compiles under -Werror.
      - name: Test the LV2 helper (random-number, spinlock, mempool) surface
        run: bash tests/sdk/sys-helpers-surface-test.sh

      # Skips without PS3DEV; the ten cell/* forwarder headers each bridge an
      # include path to the header that carries the surface.  Each forwarder
      # alone, and a TU touching one symbol from every target, compiles in
      # C/C++17 ILP32 and LP64; the CELL_ERROR_MAKE_SYNC_ERROR / RTC / SSL
      # error constructors equal their named codes, and a forwarder pointed
      # at an unrelated header is caught.
      - name: Test the cell header-path forwarders
        run: bash tests/sdk/header-path-forwarders-test.sh

      # Skips without PS3DEV; the sysutil headers for stub libraries that had
      # none compile in C/C++17, ILP32/LP64 with their layouts pinned, and link
      # all 50 functions against the twelve stub archives.
      - name: Test the sysutil API headers against their stub archives
        run: bash tests/sdk/sysutil-api-headers-test.sh

      # Skips without PS3DEV; the added NP common/ticket/TUS names compile in
      # C/C++17, ILP32/LP64 with their values pinned, and the TSS context
      # names link against the TUS stub archive.
      - name: Test the NP common, ticket and TUS names
        run: bash tests/sdk/np-content-test.sh

      # The NP error header: 931 guarded codes; compiles before and after the
      # NP headers that define some of them (skips the compile without PS3DEV).
      - name: Test the NP error codes header
        run: bash tests/sdk/np-error-codes-test.sh

      # Skips without PS3DEV; <np/drm_inline.h> (sceNpDrmOpen) compiles in
      # C/C++17, ILP32/LP64, links against the NP and FS stubs, and a
      # misspelled call in its body must fail.
      - name: Test the np/drm_inline.h sceNpDrmOpen shim
        run: bash tests/sdk/np-drm-inline-test.sh

      # Skips without PS3DEV; the eleven np/ forwarders (np/ranking.h reaches
      # cell/np/score.h, np/auth_oauth.h cell/np2/init.h) compile in C/C++17,
      # ILP32/LP64, one function pinned per forwarder; each alone; a control
      # and a self-check with np/ranking.h pointed at the wrong header.
      - name: Test the np header-path forwarders
        run: bash tests/sdk/np-path-forwarders-test.sh

      # Skips without PS3DK; with an installed SDK, a PSL1GHT-style Makefile
      # project (ppu_rules, bin2o, .self, .pkg) builds with only the tools
      # the package ships plus make.
      - name: Test the PSL1GHT-style Makefile build path
        run: bash tests/sdk/makefile-path-test.sh

      # Skips without PS3DEV; PSL1GHT sysutil names (sysUtilRegisterCallback,
      # videoGetState, msgDialogOpen2, ...) link without the SDK headers.
      - name: Test the PSL1GHT sysutil names link
        run: bash tests/sdk/psl1ght-legacy-sysutil-link-test.sh

      # Skips without PS3DEV; each of the thirteen new sysutil-tree
      # forwarders (sysutil/sysutil_ap.h through sysutil/sysutil_sysconf.h)
      # bridges to the cell/ header that carries the surface; the test TU,
      # which pins one function per target, compiles in C/C++17 in both
      # data models; a lone-forwarder TU for each; a control TU that uses
      # the real music2 forwarder; and a self-check pointing music2 at an
      # unrelated header and requiring the control to fail while a
      # different forwarder keeps building.
      - name: Test the sysutil header-path forwarders
        run: bash tests/sdk/sysutil-path-forwarders-test.sh

      # Skips without PS3DEV; with a PPU compiler, no lfs/lfd/stfs/stfd through
      # under-aligned memory (GCC patch 0061: misaligned FP access kills the
      # thread on hardware).
      - name: Test FP loads and stores stay off under-aligned memory
        run: bash tests/sdk/ppu-fp-alignment-codegen-test.sh
      - name: Float loads and stores keep a displacement that is a multiple of 4 (patch 0064)
        run: bash tests/sdk/ppu-fp-displacement-codegen-test.sh
      - name: A loop vectorised with factor 1 keeps no single realignment mask (patch 0082)
        run: bash tests/sdk/ppu-vect-realign-codegen-test.sh

      # Skips without PS3DEV; binding a vertex program and the standalone
      # cellGcmCgUploadInternalConsts helper both upload the literal pool.
      - name: Test vertex-program literal uploads
        run: bash tests/sdk/gcm-vp-literal-upload-test.sh

      # Skips without PS3DEV; the packed by-value argument scanner (a
      # std::string_view register used whole as an address) flags its red
      # fixtures and passes its green ones.
      - name: Test the packed-argument address scanner
        run: bash tests/sdk/ppu-packed-arg-scan-test.sh

      # Skips without PS3DEV; SPU gcc patch 0005: <vmx2spu.h> compiles in C++
      # (vec_sum2s's compound literal no longer splits the spu_and macro).
      - name: Test the SPU vmx2spu.h header compiles in C++
        run: bash tests/sdk/spu-vmx2spu-cxx-test.sh

      # Skip without PS3DEV; header salvage from the 2026-10-16 branch audit:
      # libnetctl.h and netinet/in.h in any order, the PRX record types and
      # SYS_SPU_QUEUE, and the SDK-owned sys/tty.h + sys/interrupt.h (ILP32
      # pointers reach the system call zero-extended).
      - name: Test struct in_addr across libnetctl.h and netinet/in.h orders
        run: bash tests/sdk/in-addr-order-test.sh
      - name: Test the PRX record types and event queue type constants
        run: bash tests/sdk/sys-prx-records-test.sh
      - name: Test the SDK-owned sys/tty.h and sys/interrupt.h
        run: bash tests/sdk/sys-tty-interrupt-test.sh
      - name: Test the SDK-owned sys/file.h (pointer arguments zero-extended)
        run: bash tests/sdk/sys-file-test.sh

      # Skips without PS3DEV; ld's TOC edit must write a zero pad word, not
      # heap bytes, after an odd-size ILP32 .toc (binutils patch 0007).
      - name: Test the TOC edit pads an odd-size .toc with zeros
        run: bash tests/sdk/toc-edit-pad-test.sh

      # Skips without a Windows C compiler that can run its output; tool-alias's
      # error message stays inside its buffer when the text does not fit.
      - name: Test the tool-alias error message on truncation
        run: bash tests/host/tool-alias-fail-test.sh

      # Patch series apply with --fuzz=0: context drift fails the build.
      - name: Test patch series apply without fuzz
        run: bash tests/host/patch-fuzz-zero-test.sh

      # Static mode: the GCC 16 series matches its port map against gcc-12.x
      # (applying it to GCC 16 sources needs --gcc-git, run off CI).
      - name: Test the GCC 16 patch series against its port map
        run: bash tests/host/gcc16-series-test.sh

      # Pure host test: exercise newlib patch 0021 getentropy provider and
      # boundary behaviors against a controlled host syscall mock.
      - name: Test the PPU getentropy platform provider
        run: bash tests/host/ppu-getentropy-test.sh

      - name: Test PSGL waits consume fresh GPU completion labels
        run: bash tests/host/psgl-wait-label-test.sh

      # build-spu-toolchain.sh: --gcc and --host pick the build root in any
      # option order, and --clean removes only that root.
      - name: Test the SPU build-root selection and --clean
        run: bash tests/host/spu-build-root-test.sh

      # Static mode: the SPU GCC 16 pass defaults live in the optimization
      # table (compiler mode, SPU16_GCC=..., runs off CI).
      - name: Test the SPU GCC 16 pass defaults
        run: |
          bash tests/host/spu-gcc16-opt-defaults-test.sh
          bash tests/host/spu-gcc16-opt-defaults-status-test.sh

      - name: Test the SPU lowpart regression verdict with host syscall stubs
        run: bash tests/host/spu-lowpart-spill-verdict-test.sh

      # build-ppu-toolchain.sh builds GCC 16.1.0 only: other --gcc values and a
      # prefix holding an earlier GCC 12.4 are refused (--print-config, no build).
      - name: Test the PPU GCC version selection
        run: bash tests/host/ppu-gcc-select-test.sh

      # Skips without PS3DEV or on GCC 12 (no ext-dce pass); gcc-16.x 0080 keeps
      # pointer facts correct with the pass enabled (overrides, attributes, LTO).
      - name: Test the ILP32 ext-dce default
        run: bash tests/host/ext-dce-default-test.sh

      # Skips without PS3DEV; gcc-16.x 0078 makes C++ default to GNU C++17
      # with every explicit dialect authoritative (both ABIs, g++ and gcc).
      - name: Test the C++ default dialect
        run: bash tests/host/cxx-default-dialect-test.sh

      # Skips without PS3DEV or on a newlib without the lv2 declarations; every
      # lv2 POSIX function the headers declare has C linkage from C++.
      - name: Test the lv2 declarations' C++ linkage
        run: bash tests/host/lv2-decls-cxx-linkage-test.sh

      # Pure host test: the PPU GCC build's thread-model stamps and reuse
      # decisions, and that both host configurations pass --enable-threads.
      - name: Test the PPU GCC thread-model rules
        run: bash tests/host/ppu-thread-model-test.sh

      # Skips without PS3DEV or on GCC 12; gcc-16.x 0073 keeps the register
      # allocator from parking values in LR on the Cell PPE.
      - name: Test the Cell LR/CTR move cost
        run: bash tests/host/cell-lr-spill-test.sh

      # Skips without PS3DEV or on a compiler without gcc-16.x patch 0068; the
      # driver's default SDK include directory declares pthread/time/sched.
      - name: Test the default SDK include directory
        run: bash tests/host/sdk-default-include-test.sh

      # Skips without PS3DEV or on GCC 12; gcc-16.x 0075/0076 give plain char,
      # wchar_t and wint_t the reference toolchain's types in both data models.
      - name: Test the PPU plain char, wchar_t and wint_t ABI
        run: bash tests/host/ppu-abi-char-wchar-test.sh

      # Skips without a PS3DEV SPU compiler; spu gcc-9.5.0 0016 gives plain char,
      # wchar_t and wint_t the reference SPU toolchain's types.
      - name: Test the SPU plain char, wchar_t and wint_t ABI
        run: bash tests/host/spu-abi-char-wchar-test.sh

      # Skips without PS3DEV; with a PPU compiler, the E* errno names must be
      # the LV2 status codes (newlib patch 0020).
      - name: Test LV2 errno values
        run: bash tests/sdk/lv2-errno-values-test.sh

      - name: Test librt lv2error maps every LV2 status code to itself
        run: bash tests/sdk/librt-lv2errno-test.sh
      # The ShellCheck ratchet fails closed at every step (enumeration,
      # shellcheck status/stderr/unparsed output, baseline parsing); driven
      # with a stub shellcheck, so no install is needed here.
      - name: Test the ShellCheck ratchet's failure handling
        run: bash tests/host/shellcheck-ratchet-test.sh

      # check-release-tree.sh refuses .self/.elf/.sprx/.prx and CMake build
      # files under samples/ and tests/: a package ships them as source.
      - name: Test the release-tree guard against shipped build outputs
        run: bash tests/host/release-tree-build-outputs-test.sh

      # Skips without PS3DEV or on GCC 12; gcc-16.x 0074 gives the installed
      # libgcc the lock-free FDE registry in both multilibs.
      - name: Test the libgcc FDE registry is the lock-free b-tree
        run: bash tests/host/libgcc-fde-fast-path-test.sh

      # Skips without PS3DEV or on a libgcc without the 0074 registry; a CRT
      # without the heap-ready flag must fail to link (fail closed).
      - name: Test the libgcc registry requires the runtime's heap-ready flag
        run: bash tests/host/libgcc-heap-ready-link-test.sh

      # Skips without a PS3DEV stage carrying 0074; the two registry tests must
      # fail when a tool prints valid output and then exits non-zero.
      - name: Test the libgcc registry tests fail closed on lying tools
        run: bash tests/host/libgcc-registry-tests-adversary-test.sh

      # Skips without PS3DEV; the ppu-asm.h statement-expression macros must
      # expand in C++17 without -Wregister (t_8d28bc61).
      - name: Test ppu-asm.h macros carry no register storage class
        run: bash tests/sdk/ppu-asm-cxx17-register-test.sh

      # Skips without PS3DK; with an installed SDK, ps3_add_spu_image must
      # refuse a SPURS job image that has no _start.
      - name: Test the SPURS job image entry guard
        run: bash tests/sdk/spu-jobbin-entry-guard-test.sh

      - name: Test the generated GCM C++ command context is current
        run: bash tests/sdk/gcm-context-cpp-test.sh

      - name: Test librt pthread_mutex_trylock returns POSIX EBUSY
        run: bash tests/sdk/librt-trylock-ebusy-test.sh

      # The GCM FIFO wrap must retire a lap the application never published
      # (t_38e8bf5a): a host model of the RSX fetcher runs the protocol, and
      # the one-phase protocol it replaced must fail the idle-lap scenario.
      - name: Test the GCM FIFO wrap never loses an unpublished lap
        run: bash tests/sdk/fifo-wrap-protocol-test.sh

      - name: Test checked initial GCM FIFO extent admission
        run: python3 tests/sdk/fifo-init-extent-test.py

      # gcmSetDefaultFifoSize after cellGcmInit (libPSGL's init path) must keep
      # the live FIFO cursor and size only within the admitted allocation.
      - name: Test default FIFO sizing keeps the live cursor
        run: python3 tests/sdk/default-fifo-size-test.py

      # The rsxMalloc/rsxMemalign/rsxFree surface in librsx and libgcm_cmd
      # silently dropped the allocator's failure reason (NULL and void).
      # This host test drives the real mm.c object against a stub heap and
      # asserts the SDK-only last-error query reports UNINIT, GCM_CONFIG,
      # ALLOCATION and FREE for the matching failure, and OK on success
      # (t_9eaa8392).
      - name: Test the RSX heap last-error diagnostic reports every failure mode
        run: bash tests/sdk/rsx-mm-lasterror-test.sh

      # The SPU libsheap core is portable C: the host build checks the heap
      # layout the firmware shares, the tree bits, the allocation rules, the
      # key-table state machine and a random run against a bitmap model.
      - name: Test the shared-heap core layout, allocator and key table
        run: bash tests/sdk/sheap-core-host-test.sh

      # libdaisy ports on the host: a cancelled push or pop comes back on the
      # port's next begin while other ends hold later entries, and the
      # COPY / REFERENCE forms and COPY-mode cancel misuse fail to compile.
      - name: Test libdaisy port cancel semantics and mode checks
        run: bash tests/sdk/daisy-pipe-host-test.sh

      # The simdmath f4fast forms on the host: each form over its documented
      # domain against double-precision libm, with 12-bit estimates.
      - name: Test simdmath fast-form accuracy
        run: bash tests/sdk/simdmath-fast-host-test.sh

      # The SPU libsync sources over a simulated MFC: queue and rwm
      # descriptors survive Initialize, the mutex is the PPU's ticket word
      # (checked against a PPU-side model), barrier counts are validated.
      - name: Test the SPU libsync queue, rwm, mutex and barrier on the host
        run: bash tests/sdk/libsync-spu-host-test.sh

      # The SPU libsync2 waiting queue over a simulated MFC, two local
      # stores sharing one queue: FIFO wake-ups, the wake-before-entry
      # marker and both phase bits across wraps, then again with every
      # other conditional store lost.
      - name: Test the SPU libsync2 waiting queue on the host
        run: bash tests/sdk/sync2-waiting-queue-host-test.sh

      # install-headers copies an explicit list; a header missing from it is
      # left out of the installed SDK and breaks the full SDK build.
      - name: Test every tracked SDK header is installed
        run: bash tests/sdk/sdk-header-list-test.sh

      # No PPU toolchain on this runner, so only the host-only checks (A and
      # D) run here; the archive checks (B and C) skip themselves and are
      # run by scripts/build-cell-stub-archives.sh against the tree it has
      # just installed, which is the only context where they can execute.
      - name: Test the legacy gcm* surface is fully defined
        run: bash tests/sdk/gcm-legacy-symbol-coverage-test.sh
      # Host-only: a PPU header with the same path as an SPU header shadows
      # it in the SPU libraries that list sdk/include first; a new pair must
      # pass SPU compiles on with #include_next (the full SDK build that
      # would otherwise catch it runs only in the release pipeline).
      - name: Test no PPU header shadows an SPU header unguarded
        run: bash tests/sdk/spu-header-shadow-test.sh

      # Every reference stub-archive database is built under its reference
      # name.  Only the host check (A) runs here; the installed-archive check
      # (B) needs a built tree and runs from build-cell-stub-archives.sh.
      - name: Test every reference stub archive name is built
        run: bash tests/sdk/reference-stub-archive-names-test.sh

      # sdk_version.h defines CELL_SDK_VERSION and is installed for SPU too.
      # Only the host install check (A) runs here; B needs an installed SDK.
      - name: Test sdk_version.h reaches PPU and SPU with CELL_SDK_VERSION
        run: bash tests/sdk/sdk-version-header-test.sh

      # t_cab4a49d: the installed-copy map (which artifacts replace a vendored
      # PSL1GHT copy) must stay consistent across the manifest, the per-site
      # REPLACING log lines, the docs page, and which-copy.sh.  Host-only; the
      # live "full build log greps to the list" half is exercised on a built
      # tree by scripts/build-*.sh emitting those same REPLACING lines.
      - name: Test the installed-copy map stays consistent across manifest/log/docs
        run: bash tests/sdk/installed-copy-map-consistency-test.sh

      # t_cab4a49d: the verify-installed-copy-map.sh helper's misuse guards --
      # refuse shared-SDK collisions, a toolchain escape of the scratch prefix
      # ('..' or a scratch-local symlink), and TCHAIN==SCRATCH.  Host-only.
      - name: Test the installed-copy-map verify helper's shared-SDK and escape guards
        run: bash tests/sdk/verify-installed-copy-map-guard-test.sh

      # A render target's type field takes the SURFACE family, never the
      # texture-filter family. The mixup compiled, passed RPCS3, and hung a
      # real PS3 on a black screen; 23 samples and our own PSGL carried it.
      - name: Test render-target surface types use the surface enum family
        run: bash tests/sdk/surface-type-enum-test.sh

      # ps3_add_self must respect OUTPUT_DIRECTORY keyword and PS3_SELF_OUTPUT_DIRECTORY
      # variable, falling back to CMAKE_CURRENT_SOURCE_DIR by default. ps3_add_pkg
      # must follow the same resolved directory.
      - name: Test ps3_add_self output directory override
        run: bash tests/sdk/cmake-self-output-dir-test.sh

      # A target that opts into LP64 with -mlp64 must be post-linked with
      # sprxlinker --lp64, as the LP64 toolchain file does for whole projects.
      - name: Test ps3_add_self post-links -mlp64 targets for LP64
        run: bash tests/sdk/cmake-self-lp64-postlink-test.sh

      - name: Test librt pathname limits and error propagation
        run: bash tests/sdk/librt-pathconf-test.sh

      - name: Test librt joins relative paths to the working directory verbatim
        run: bash tests/sdk/librt-resolve-path-host-test.sh

      - name: Test libdma splits large and unaligned transfers into legal MFC commands
        run: bash tests/sdk/libdma-split-host-test.sh

      - name: Test librt heap configuration and failure diagnostics
        run: bash tests/sdk/librt-heap-test.sh

      - name: Test librt low-level exit and finalizer registration
        run: bash tests/sdk/librt-exit-test.sh

      - name: Test librt stat and fstat report EOVERFLOW for sizes beyond off_t
        run: bash tests/sdk/librt-fstat-eoverflow-test.sh

      - name: Test POSIX clocks sleep and scheduling attributes
        run: python3 tests/sdk/posix-time-host-test.py

      - name: Test POSIX time declarations and links when cross SDK is available
        run: python3 tests/sdk/posix-time-cross-test.py

      - name: Test audio compatibility alias ownership when cross SDK is available
        run: python3 tests/sdk/audio-alias-link-test.py

      - name: Test SPURS task entry argument and exit-code forwarding
        run: python3 tests/sdk/spurs-task-entry-host-test.py

      - name: Test SPURS task entry links when cross SDK is available
        run: python3 tests/sdk/spurs-task-entry-cross-test.py

      - name: Test SPURS driver selection and startup ownership
        run: |
          python3 tests/sdk/spurs-driver-trace-test.py
          python3 tests/sdk/spurs-startup-ownership-test.py
          python3 tests/sdk/spurs-driver-link-test.py
          python3 tests/sdk/spurs-linker-mode-test.py
          python3 tests/sdk/spurs-guid-reservation-test.py
          python3 tests/sdk/spurs-common-archive-test.py
          python3 tests/sdk/spu-shared-refusal-test.py

      - name: Test SPU nop opcode and dotted directive dispatch
        run: python3 tests/sdk/spu-nop-dispatch-test.py

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test AltiVec keywords under a strict -std=
        run: bash tests/sdk/altivec-strict-std-test.sh

      # Skips without PS3DEV; with a PPU compiler, the ILP32 reproducer must
      # form no address from an untruncated 32-bit reload (GCC patch 0049).
      - name: Test ILP32 address formation in the IV-spill reproducer
        run: bash tests/sdk/ilp32-ivspill-codegen-test.sh

      # The red control always runs; with a PPU compiler, every counted loop's
      # CTR count must have a defined upper half (fixed by GCC patch 0050,
      # retired once 0059 made Pmode DImode).
      - name: Test ILP32 counted-loop CTR counts
        run: bash tests/sdk/ilp32-doloop-codegen-test.sh

      # GCC patch 0029: an ILP32 pointer converted directly to a 64-bit integer
      # zero-extends.  The embedded controls always run; the compile leg needs
      # a PPU compiler (release gate); tests/regression/ilp32-ptr-widen is the
      # runtime half.
      - name: Test ILP32 pointer widening
        run: bash tests/sdk/ilp32-pointer-widen-codegen-test.sh

      # A pointer taken from a by-value aggregate packed in one GPR is never used
      # as an address with the other member in the high word (retired 0033,
      # carried by 0059).  Needs a PPU compiler (release gate).
      - name: Test ILP32 packed by-value arguments
        run: bash tests/sdk/ilp32-packed-arg-codegen-test.sh

      # GCC patch 0066: -mlp64 without the 64-bit mode is refused, judged on the
      # final options (skips without a PPU compiler; runs in the release gate).
      - name: Test -mlp64 requires the 64-bit mode
        run: bash tests/sdk/lp64-requires-64bit-test.sh

      # Callee-saved GPRs and the LR slot are saved at full width (the fixes of
      # retired patches 0031/0037, carried by 0059).  The embedded controls
      # always run; the compile leg needs a PPU compiler (release gate).
      - name: Test callee-save and LR-slot width
        run: bash tests/sdk/ilp32-callee-save-width-codegen-test.sh

      # Skips without PS3DEV; with a PPU toolchain, --gc-sections must keep
      # functions reached only through compact .opd descriptors (binutils 0004).
      - name: Test --gc-sections keeps descriptor-only PPU functions
        run: bash tests/sdk/opd-gc-sections-test.sh

      # Skips without PS3DEV; with a PPU toolchain, a compact-.opd link that
      # needs more than one TOC group must be refused (binutils 0005).
      - name: Test compact-.opd links refuse multiple TOC groups
        run: bash tests/sdk/large-toc-test.sh

      # Skips without PS3DEV; with a PPU toolchain, a link that mixes ILP32
      # and LP64 objects must be refused (GCC 0058, binutils 0006).
      - name: Test links refuse mixed ILP32 and LP64 objects
        run: bash tests/sdk/data-model-link-test.sh

      # The header-checker self-test always runs; with PS3DEV, a plain
      # `ar rcs` must be byte-reproducible and every installed archive must
      # carry zero member mtime/uid/gid and mode 644 (binutils is built with
      # --enable-deterministic-archives).
      - name: Test ar writes deterministic archives and the SDK installs only those
        run: bash tests/sdk/deterministic-archives-test.sh

      # The red control always runs; with a PPU compiler, every virtual
      # thunk must sign-extend its vcall offset before the add (GCC patch 0056).
      - name: Test ILP32 virtual-thunk vcall offsets
        run: bash tests/sdk/ilp32-thunk-vcall-codegen-test.sh

      # The controls always run; with a PPU compiler, every TLS access model
      # compiles to its relocations or a clean sorry, never an ICE, and no
      # 8-byte GOT TP/DTP slot is read by lwz (GCC patch 0057).
      - name: Test PPU TLS access models in both data models
        run: bash tests/sdk/ilp32-tls-models-codegen-test.sh

      # The stack protector compiles in both data models with pointer-width
      # guard and canary accesses (GCC patch 0067); the checker controls run
      # here, the compile leg needs PS3DEV (release gate).
      - name: Test PPU stack protector codegen
        run: bash tests/sdk/ppu-stack-protector-codegen-test.sh

      # The libc wrapper headers chain with #include_next outside their
      # guards, so the SDK's own build (source and installed copies on the
      # path) still reaches libc; the compile leg needs PS3DEV.
      - name: Test SDK wrapper header chaining
        run: bash tests/sdk/sdk-wrapper-chain-test.sh

      # Skips without PS3DEV; with a PPU compiler, AltiVec memory builtins that
      # take a pointer must compile under the ILP32 address model (GCC 0059).
      - name: Test AltiVec pointer builtins under ILP32
        run: bash tests/sdk/altivec-builtin-address-test.sh

      # An indirect call must save the TOC after any PRX stub call before it:
      # stubs store it with a 4-byte stw, Pmode DImode restores it with ld
      # (GCC 0060).
      - name: Test the TOC is saved at each indirect call
        run: bash tests/sdk/toc-save-indirect-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test -mminimal-toc in both PPU ABIs
        run: bash tests/sdk/minimal-toc-ilp32-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test the SDK stdarg.h wrapper forwards on every inclusion
        run: bash tests/sdk/stdarg-reentry-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test SPU code can include the C++ vector math headers
        run: bash tests/sdk/spu-vectormath-include-test.sh

      # Skips without PS3DEV; checks the installed SPU libatomic.a.
      - name: Test the SPU libatomic archive defines every operation
        run: bash tests/sdk/spu-libatomic-test.sh

      # Skips without PS3DEV; checks the installed SPU libsheap.a and links
      # a program calling its whole API.
      - name: Test the SPU libsheap archive exports and links its API
        run: bash tests/sdk/spu-sheap-link-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test SPU C++ parenthesised vector literals and casts
        run: bash tests/sdk/spu-paren-vector-cpp-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test SPU sibling calls avoid call-saved argument registers
        run: bash tests/sdk/spu-sibcall-call-saved-test.sh

      # Skips without PS3DEV; compiles this tree's SPU atomic header in C/C++.
      - name: Test SPU atomic alignment predicates select integer intrinsics
        run: bash tests/sdk/spu-atomic-overload-test.sh

      # Skips without PS3DEV; runs against an installed or candidate compiler.
      - name: Test the reference PS3 platform macros are predefined
        run: bash tests/sdk/platform-predefines-test.sh

      # Skips without PS3DEV; runs against the installed SDK headers.
      - name: Test the SPU SPURS headers declare the EA API and keep the PPU API
        run: bash tests/sdk/spurs-spu-header-surface-test.sh

      # Skips without PS3DEV/cmake; builds the spurs sample at two equal-length,
      # different build dirs and pins the PPU ELF and embedded SPU image to be byte-identical
      # and its .note.spu_name to carry the bare file name (not a build path).
      - name: Test the embedded SPU image is build-path independent
        run: bash tests/sdk/spu-name-note-path-test.sh

      # Skips without PS3DEV; compiles this tree's GCM headers under -Werror.
      - name: Test the GCM headers define each macro once
        run: bash tests/sdk/gcm-redefinition-test.sh

      # Skips without PS3DEV; the link-time Cell GCM commands compile through
      # <cell/gcm.h> and libgcm_cmd.a defines each one once, in both ABIs.
      - name: Test the link-time GCM command surface
        run: bash tests/sdk/gcm-link-surface-test.sh

      # Always executes the real header's value assertions in C11 and C++17.
      - name: Test the sysmodule ids on the host
        run: bash tests/sdk/sysmodule-ids-test.sh --host

      # Additional target-header check when a PPU toolchain is available.
      - name: Test the sysmodule ids with the PPU compiler
        run: bash tests/sdk/sysmodule-ids-test.sh

      # Skips without PS3DEV; compiles and links every SPU cellDma name.
      - name: Test the SPU cellDma surface compiles and links
        run: bash tests/sdk/spu-celldma-api-test.sh

      # Skips without PS3DEV; compiles this tree's PRX headers in every order.
      - name: Test the PRX headers work alone and in either order
        run: bash tests/sdk/prx-headers-test.sh

      # pkg host tool must handle long paths (>512 chars POSIX, >260 Win32),
      # fail non-zero without writing packages when files cannot be read, and
      # produce byte-identical packages for standard payloads.
      - name: Test pkg host tool long paths and error handling
        run: bash tests/sdk/pkg-test.sh

      - name: Test Linux pkg installation and release staging
        run: bash tests/sdk/linux-pkg-install-test.sh

      - name: Test newlib remove directory fallback
        run: bash tests/sdk/newlib-remove-test.sh

      - name: Test rsx-cg-compiler operator lexing
        run: bash tests/shader-compiler/operator-lexer-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler register lane remapping
        run: bash tests/shader-compiler/lane-remap-test.sh

      - name: Test rsx-cg-compiler angle stdlib
        run: bash tests/shader-compiler/stdlib-angle-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler log10 stdlib
        run: bash tests/shader-compiler/stdlib-log10-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler smoothstep stdlib
        run: bash tests/shader-compiler/stdlib-smoothstep-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler atan2 stdlib
        run: bash tests/shader-compiler/stdlib-atan2-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler trig polynomial stdlib
        run: bash tests/shader-compiler/stdlib-trig-poly-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler derivatives stdlib
        run: bash tests/shader-compiler/stdlib-derivatives-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler DIVR opcode
        run: bash tests/shader-compiler/divr-opcode-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Fragment programs share literal expressions, reciprocals and pow2 divide scales
        run: bash tests/shader-compiler/fp-literal-sharing-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Scalar local initializers broadcast to vectors once
        run: bash tests/shader-compiler/scalar-vector-decl-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Helper struct annotations do not bind entry inputs
        run: bash tests/shader-compiler/helper-struct-semantic-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Vertex division scalar-unit guard
        run: bash tests/shader-compiler/vp-division-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Packed depth texture decode guard
        run: bash tests/shader-compiler/texdepth-decode-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test source swizzle composition in both shader profiles
        run: bash tests/shader-compiler/local-swizzle-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler user-function inlining
        run: bash tests/shader-compiler/user-function-inline-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler write masks
        run: bash tests/shader-compiler/write-mask-clobber-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler refusal semantics
        run: bash tests/shader-compiler/refusal-semantics-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler control-flow flatten
        run: bash tests/shader-compiler/control-flow-flatten-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler static loop unroll
        run: bash tests/shader-compiler/static-loop-unroll-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test empty statements and surrounding control flow
        run: bash tests/shader-compiler/empty-statement-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Static loop expansion twins
        run: bash tests/shader-compiler/static-loop-expansion-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Helper static loop expansion twins
        run: bash tests/shader-compiler/helper-static-loop-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Member array stores and current selectors
        run: bash tests/shader-compiler/member-array-store-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler file-scope const folding
        run: bash tests/shader-compiler/const-fold-value-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

