      - name: Test rsx-cg-compiler general-path operand legalisation
        run: bash tests/shader-compiler/general-operand-legalisation-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler select merge of raw inputs
        run: bash tests/shader-compiler/select-merge-inputs-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler unsafe select predication
