name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-pipeline:
    name: Version pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: scripts/version.sh — all formats
        run: |
          ./scripts/version.sh --format=plain
          ./scripts/version.sh --format=bare
          ./scripts/version.sh --format=cmake
          ./scripts/version.sh --format=header
          ./scripts/version.sh --format=json

      - name: scripts/sync-versions.sh --dry-run
        run: ./scripts/sync-versions.sh --dry-run

  rust-tools:
    name: Rust tools build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('tools/Cargo.lock') }}

      - name: cargo build
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: cargo test
        working-directory: tools
        run: cargo test --workspace

  host-tools-cxx:
    name: C/C++ host tools build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libelf-dev cmake ninja-build python3

      - name: Build sprx-linker
        run: make -C tools/sprx-linker

      - name: Build rsx-cg-compiler
        run: |
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler

      - name: Validate rsx-cg-compiler --version
        run: tools/rsx-cg-compiler/build/rsx-cg-compiler --version

      - name: Test rsx-cg-compiler operator lexing
        run: bash tests/shader-compiler/operator-lexer-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler angle stdlib
        run: bash tests/shader-compiler/stdlib-angle-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler log10 stdlib
        run: bash tests/shader-compiler/stdlib-log10-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler smoothstep stdlib
        run: bash tests/shader-compiler/stdlib-smoothstep-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler user-function inlining
        run: bash tests/shader-compiler/user-function-inline-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler write masks
        run: bash tests/shader-compiler/write-mask-clobber-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler refusal semantics
        run: bash tests/shader-compiler/refusal-semantics-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler control-flow flatten
        run: bash tests/shader-compiler/control-flow-flatten-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler file-scope const folding
        run: bash tests/shader-compiler/const-fold-value-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler uniform patch lanes
        run: bash tests/shader-compiler/uniform-patch-lane-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler uniform compiled defaults
        run: bash tests/shader-compiler/uniform-compiled-default-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler texcoord 2D flags
        run: bash tests/shader-compiler/texcoord-2d-flags-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler TEXCOORD8/9 masks
        run: bash tests/shader-compiler/texcoord-89-mask-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler discard completeness
        run: bash tests/shader-compiler/discard-completeness-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler discard guards
        run: bash tests/shader-compiler/discard-guard-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler lane inserts
        run: bash tests/shader-compiler/lane-insert-literal-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler literal const dedup
        run: bash tests/shader-compiler/literal-const-dedup-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler MAD literal operands
        run: bash tests/shader-compiler/mad-literal-operand-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler vertex constructor lanes
        run: bash tests/shader-compiler/vp-construct-lanes-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler vertex literal pool
        run: bash tests/shader-compiler/vp-literal-vector-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler VP opcode fallthrough
        run: bash tests/shader-compiler/vp-opcode-fallthrough-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler int literals in float constructors
        run: bash tests/shader-compiler/int-literal-ctor-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler matrix row indexing
        run: bash tests/shader-compiler/vp-matrix-row-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler two-varying operands
        run: bash tests/shader-compiler/two-varying-operands-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler general-path operand legalisation
        run: bash tests/shader-compiler/general-operand-legalisation-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler select merge of raw inputs
        run: bash tests/shader-compiler/select-merge-inputs-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler unsafe select predication
        run: bash tests/shader-compiler/unsafe-select-predication-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler defaulted output semantic
        run: bash tests/shader-compiler/out-no-semantic-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler per-lane vector writes
        run: bash tests/shader-compiler/insert-lane-of-vector-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test rsx-cg-compiler dot width
        run: bash tests/shader-compiler/dot-width-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler dot-reduction width
        run: bash tests/shader-compiler/dot-reduction-width-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler half precision
        run: bash tests/shader-compiler/half-precision-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler lowering-path flags
        run: bash tests/shader-compiler/lowering-path-flags-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler fragment registerCount invariant
        run: bash tests/shader-compiler/register-count-invariant-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler colour reaches R0
        run: bash tests/shader-compiler/colour-reaches-r0-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler scalar-unit lanes
        run: bash tests/shader-compiler/scalar-unit-lane-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler int-float casts
        run: bash tests/shader-compiler/int-float-cast-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler vector subscript bounds
        run: bash tests/shader-compiler/vector-subscript-bounds-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test shader-differential corpus stager
        run: bash tests/regression/shader-differential/stager-corpus-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

  host-tools-windows:
    name: Host tools build (windows mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 / mingw64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-python
            mingw-w64-x86_64-rust

      - name: cargo build (windows)
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: Build sprx-linker (static)
        run: |
          set -e
          cd tools/sprx-linker
          gcc -O2 -Wall -std=gnu99 -static -o sprxlinker.exe sprx-linker.c \
              -lelf -lz -lzstd

      - name: Build rsx-cg-compiler (static)
        run: |
          set -e
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler

      - name: Validate --version
        run: |
          set -e
          tools/rsx-cg-compiler/build/rsx-cg-compiler.exe --version
          file tools/sprx-linker/sprxlinker.exe
