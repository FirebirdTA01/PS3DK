        run: bash tests/shader-compiler/local-array-index-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler MRT output registers and precision
        run: bash tests/shader-compiler/mrt-output-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler output temporary reuse
        run: bash tests/shader-compiler/output-temp-reuse-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler scheduler output writes
        run: bash tests/shader-compiler/scheduler-output-waw-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler scheduler partial writers
        run: bash tests/shader-compiler/scheduler-partial-writer-raw-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler predicated select output aliases
        run: bash tests/shader-compiler/selpred-output-alias-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test predicated-select emission refuses invalid allocations
        run: bash tests/shader-compiler/selpred-emission-guard-test.sh
      # Linux host-tools job: the unit script requires a POSIX c++ compiler.
      - name: Test scalar emission refuses conflicting operand lanes
        run: bash tests/shader-compiler/scalar-emission-guard-test.sh
      - name: Test rsx-cg-compiler short-circuit root comparisons
        run: bash tests/shader-compiler/short-root-comparison-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler step register collisions
        run: bash tests/shader-compiler/step-register-collision-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Test rsx-cg-compiler vertex attributes and clip planes
        run: bash tests/shader-compiler/vp-attr-clp-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: Name the sources of a fragment instruction, and check the arity table
        run: bash tests/shader-compiler/fp-sources-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler
      - name: A scalar stored to the colour output must read the lane it selected
        run: bash tests/shader-compiler/output-store-lane-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      # LAST of the shader-compiler steps on purpose: it runs every sibling
      # script against a compiler that CRASHES instead of refusing, so it is
      # only meaningful once those scripts have been seen green normally.
      - name: No guard may read a crash as a refusal
        run: bash tests/shader-compiler/refusal-status-adversary-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

      - name: Test shader corpus fetch metadata and destination guards
        run: bash tests/shader-corpus/fetch-shader-corpus-test.sh

      - name: Test shader-differential corpus stager
        run: bash tests/regression/shader-differential/stager-corpus-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler

  host-tools-windows:
    name: Host tools build (windows mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v5

      - name: Test shader-differential current census helpers
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\container-metrics-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\container-metrics-allowance-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\container-metrics-identity-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\current-census-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\current-gap-summary-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\reference-tree-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\retired-lowering-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\stage-roots-test.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\manifest-controls-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\shipped-coverage-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\shader-differential\path-pair-corpus-inputs-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\rpcs3-process-guard-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\regression\rpcs3-claim-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSYS2 / mingw64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-python
            mingw-w64-x86_64-rust

      - name: Test sampler refusal with the configured native compiler
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/regression/shader-differential/sampler-kind-refusal-test.ps1 -CCompiler gcc

      - name: cargo build (windows)
        working-directory: tools
        run: cargo build --workspace --all-targets

      - name: Build sprx-linker (static)
        run: |
          set -e
          cd tools/sprx-linker
          gcc -O2 -Wall -std=gnu99 -static -o sprxlinker.exe sprx-linker.c \
              -lelf -lz -lzstd

      - name: Build rsx-cg-compiler (static)
        run: |
          set -e
          cmake -S tools/rsx-cg-compiler -B tools/rsx-cg-compiler/build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build tools/rsx-cg-compiler/build --target rsx-cg-compiler cgnv2elf

      - name: Validate --version
        run: |
          set -e
          tools/rsx-cg-compiler/build/rsx-cg-compiler.exe --version
          tools/rsx-cg-compiler/build/cgnv2elf.exe --version
          file tools/sprx-linker/sprxlinker.exe

      - name: Exercise Windows refusal adversary
        env:
          PS3TC_ADVERSARY_VERBOSE: "1"
          PS3TC_ADVERSARY_ONLY: >-
            float-literal-syntax-test.sh mrt-output-test.sh nested-struct-test.sh
            sampler-binding-test.sh short-root-comparison-test.sh
            struct-field-update-test.sh tex1d-test.sh vp-special-output-test.sh
        run: bash tests/shader-compiler/refusal-status-adversary-test.sh tools/rsx-cg-compiler/build/rsx-cg-compiler.exe
