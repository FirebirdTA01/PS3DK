name: GCC 16 build

# A real GCC 16 PPU toolchain build of the GCC 16 integration branch, with the
# runtime and SDK its compile+link checks need, from a fresh prefix.  The
# regular CI workflow builds no target toolchain, so its compiler-dependent
# probes skip; here a skip is a failure.
#
# Manual dispatch only for now.  A nightly schedule is added after the first
# successful, measured run (runtime and runner disk recorded below); it must
# live on the default branch, which is why this file does - it checks out the
# requested ref (default feat/gcc16) and records the resolved commit.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default feat/gcc16)"
        required: false
        default: "feat/gcc16"

permissions:
  contents: read

concurrency:
  group: gcc16-build
  cancel-in-progress: false

jobs:
  gcc16-ppu:
    name: GCC 16 PPU toolchain + SDK + target checks
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LOGS: ${{ github.workspace }}/gcc16-logs
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'feat/gcc16' }}
          fetch-depth: 0

      - name: Record identity and runner resources
        shell: bash
        run: |
          mkdir -p "$LOGS"
          {
            echo "requested_ref=${{ inputs.ref || 'feat/gcc16' }}"
            echo "resolved_commit=$(git rev-parse HEAD)"
            echo "workflow_commit=${{ github.sha }}"
            echo "runner=$(uname -a)"
            echo "nproc=$(nproc)"
            date -u +start=%Y-%m-%dT%H:%M:%SZ
          } | tee "$LOGS/identity.txt"
          df -h / "$GITHUB_WORKSPACE" | tee "$LOGS/disk-start.txt"
          free -h | tee "$LOGS/memory.txt"
          echo "Resolved commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential gcc-12 g++-12 cmake ninja-build texinfo \
              bison flex libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
              zlib1g-dev libreadline-dev libncurses-dev libexpat1-dev \
              libssl-dev libelf-dev python3 python3-dev git wget patch \
              autoconf automake libtool zip unzip

      - uses: dtolnay/rust-toolchain@stable

      # Sources only (keyed by the scripts that pin them); no toolchain or
      # object cache: every run builds into a fresh prefix.
      - name: Cache upstream sources
        uses: actions/cache@v5
        with:
          path: src/upstream
          key: upstream-gcc16-${{ hashFiles('scripts/bootstrap.sh', 'scripts/build-ppu-toolchain.sh', 'scripts/build-spu-toolchain.sh') }}

      # A unique prefix for this run, asserted absent BEFORE bootstrap (which
      # creates its empty layout).  A non-fresh prefix fails; nothing deletes
      # one to make the check pass.  env.sh keeps an exported PS3DEV.
      - name: Fresh prefix
        shell: bash
        run: |
          P="$RUNNER_TEMP/ps3dev-${{ github.run_id }}-${{ github.run_attempt }}"
          test ! -e "$P" || { echo "prefix $P already exists; this workflow builds into a fresh prefix"; exit 1; }
          echo "PS3DEV=$P" >> "$GITHUB_ENV"
          echo "PS3DEV=$P (absent before bootstrap)" | tee -a "$LOGS/identity.txt"

      - name: Bootstrap upstream sources (+ the GCC 16.1.0 tag)
        shell: bash
        run: |
          source scripts/env.sh
          ./scripts/bootstrap.sh 2>&1 | tee "$LOGS/bootstrap.log"
          git -C src/upstream/gcc rev-parse -q --verify refs/tags/releases/gcc-16.1.0 ||
            git -C src/upstream/gcc fetch --depth 1 --no-tags origin \
                "refs/tags/releases/gcc-16.1.0:refs/tags/releases/gcc-16.1.0"
          git -C src/upstream/gcc rev-parse refs/tags/releases/gcc-16.1.0 | tee "$LOGS/gcc16-tag.txt"

      - name: Build SPU toolchain
        shell: bash
        run: |
          source scripts/env.sh
          set -o pipefail
          ./scripts/build-spu-toolchain.sh 2>&1 | tee "$LOGS/spu-toolchain.log"

      - name: Build PPU toolchain (GCC 16, posix thread model)
        shell: bash
        run: |
          source scripts/env.sh
          set -o pipefail
          PS3_GCC_THREADS=posix ./scripts/build-ppu-toolchain.sh --gcc=16 2>&1 | tee "$LOGS/ppu-toolchain.log"

      - name: Assert GCC 16, posix, both multilibs
        shell: bash
        run: |
          source scripts/env.sh
          set -e
          G="$PS3DEV/ppu/bin/powerpc64-ps3-elf-gcc"
          "$G" --version | head -1 | tee -a "$LOGS/identity.txt"
          "$G" -dumpfullversion | grep -qx '16\.1\.0'
          "$G" -v 2>&1 | grep -x 'Thread model: posix'
          "$G" -print-multi-lib | tee "$LOGS/multilib.txt"
          grep -q '^lp64;@mlp64$' "$LOGS/multilib.txt"
          for m in "" -mlp64; do
            lib=$("$G" $m -print-libgcc-file-name); test -f "$lib"; echo "libgcc ${m:-ilp32}: $lib" | tee -a "$LOGS/identity.txt"
          done
          "$PS3DEV/spu/bin/spu-elf-gcc" --version | head -1 | tee -a "$LOGS/identity.txt"
          # Identities tying the run to its artifacts: the driver and its
          # programs, and each multilib's runtime archives.
          {
            sha256sum "$G" "$PS3DEV/spu/bin/spu-elf-gcc"
            for p in cc1 cc1plus lto1; do f=$("$G" -print-prog-name=$p); test -f "$f"; sha256sum "$f"; done
            for m in "" -mlp64; do
              for a in libgcc.a libgcc_eh.a libstdc++.a libsupc++.a libc.a libm.a; do
                f=$("$G" $m -print-file-name=$a); test -f "$f"; sha256sum "$f"
              done
            done
          } | sed "s#$PS3DEV/#\$PS3DEV/#" | tee "$LOGS/toolchain-identities.txt"

      - name: Host tools
        shell: bash
        run: |
          source scripts/env.sh
          set -o pipefail
          ./scripts/install-host-tools.sh 2>&1 | tee "$LOGS/host-tools.log"

      - name: Runtime and SDK (PSL1GHT, headers, stub archives, SDK libraries)
        shell: bash
        run: |
          source scripts/env.sh
          set -o pipefail
          ./scripts/build-psl1ght.sh 2>&1 | tee "$LOGS/psl1ght.log"
          ./scripts/build-sdk.sh --headers-only 2>&1 | tee "$LOGS/sdk-headers.log"
          ./scripts/build-cell-stub-archives.sh 2>&1 | tee "$LOGS/stub-archives.log"
          # install-host-tools.sh already built and installed the host tools
          # (rsx-cg-compiler included); the SDK build does not repeat them.
          ./scripts/build-sdk.sh --no-host-tools 2>&1 | tee "$LOGS/sdk.log"

      # Each check must run and pass: exit 0 AND no SKIP line (they skip when
      # they cannot find a compiler, which here is a failure).
      - name: Target checks (no SKIP allowed)
        shell: bash
        run: |
          source scripts/env.sh
          fails=0
          check() {   # name, command...  (every check runs; failures are counted, not fatal)
            local name=$1; shift; local rc=0
            if "$@" > "$LOGS/check-$name.log" 2>&1; then rc=0; else rc=$?; fi
            if [ $rc -ne 0 ]; then echo "FAIL $name (rc $rc)"; fails=$((fails+1))
            elif grep -q 'SKIP' "$LOGS/check-$name.log"; then echo "FAIL $name (skipped)"; fails=$((fails+1))
            else echo "PASS $name"; fi
          }
          check ppu-abi-char-wchar    bash tests/host/ppu-abi-char-wchar-test.sh
          check spu-abi-char-wchar    bash tests/host/spu-abi-char-wchar-test.sh
          check ppu-thread-model      bash tests/host/ppu-thread-model-test.sh
          check lv2-decls-cxx-linkage bash tests/host/lv2-decls-cxx-linkage-test.sh
          check cell-lr-spill         bash tests/host/cell-lr-spill-test.sh
          check ext-dce-default       bash tests/host/ext-dce-default-test.sh
          check sdk-default-include   bash tests/host/sdk-default-include-test.sh
          check cxx20-header          sh tests/host/cxx20-header-test.sh
          check lv2-errno-values      bash tests/sdk/lv2-errno-values-test.sh --ps3dev "$PS3DEV"
          check gcc16-series          bash tests/host/gcc16-series-test.sh
          echo "target-check failures: $fails" | tee "$LOGS/checks-summary.txt"
          [ $fails -eq 0 ]

      # Compile and link every regression row (both ABIs where the row builds
      # them); no boot - RPCS3 and hardware runs stay outside CI.
      # A row that returns early or skips still exits 0 with nothing built, so
      # exit status is not the evidence: every SELF the checked-out manifest
      # names must exist and be non-empty afterwards (no SELF is tracked, so
      # each one was built by this run), and its hash is recorded.
      - name: Build every regression row
        shell: bash
        run: |
          source scripts/env.sh
          test -z "$(git ls-files 'tests/regression/*.self' 'tests/regression/**/*.self')" ||
            { echo "tracked SELFs under tests/regression: outputs would not prove a build"; exit 1; }
          # gate <manifest> <out>: every manifest row's SELF present and non-empty; hashes to <out>.
          gate() {
            local missing=0 rows=0
            : > "$2"
            while IFS=, read -r name self rest; do
              case "$name" in ''|'#'*|name) continue ;; esac
              rows=$((rows+1))
              if [ -s "$self" ]; then sha256sum "$self" >> "$2"
              else echo "MISSING $name $self"; missing=$((missing+1)); fi
            done < "$1"
            echo "manifest rows: $rows, missing or empty: $missing"
            [ "$rows" -gt 0 ] && [ "$missing" -eq 0 ]
          }
          # Control: a manifest naming a SELF nothing builds must FAIL the gate.
          printf 'gate-control,tests/regression/no-such-row/no-such.fake.self,1,RAN-CLEAN,x,y\n' > "$RUNNER_TEMP/control-manifest.txt"
          if gate "$RUNNER_TEMP/control-manifest.txt" "$RUNNER_TEMP/control-hashes.txt" > "$LOGS/gate-control.log"; then
            echo "the output gate passed a manifest with no built SELF - the gate is broken"; exit 1
          fi
          echo "gate control: fails on a missing SELF, as it must" | tee -a "$LOGS/rows-summary.txt"
          attempted=0; ok=0; failed=0
          for c in tests/regression/*/CMakeLists.txt; do
            d=$(dirname "$c"); r=$(basename "$d"); b="$RUNNER_TEMP/rows/$r"; attempted=$((attempted+1))
            if cmake -S "$d" -B "$b" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/ps3-ppu-toolchain.cmake" > "$LOGS/row-$r.cfg.log" 2>&1 &&
               cmake --build "$b" > "$LOGS/row-$r.bld.log" 2>&1; then echo "ok   $r"; ok=$((ok+1))
            else echo "FAIL $r"; failed=$((failed+1)); fi
          done
          echo "row dirs: attempted $attempted, succeeded $ok, failed $failed" | tee -a "$LOGS/rows-summary.txt"
          outputs=0; gate tests/regression/manifest.txt "$LOGS/row-self-sha256.txt" | tee -a "$LOGS/rows-summary.txt" || outputs=1
          [ "$failed" -eq 0 ] && [ "$outputs" -eq 0 ]

      - name: Record end resources
        if: always()
        shell: bash
        run: |
          date -u +end=%Y-%m-%dT%H:%M:%SZ | tee -a "$LOGS/identity.txt"
          df -h / "$GITHUB_WORKSPACE" | tee "$LOGS/disk-end.txt"
          du -sh stage src/upstream "$HOME/ps3tc" 2>/dev/null | tee "$LOGS/sizes.txt" || true   # a missing path is not a failure here

      - name: Keep logs and identities
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gcc16-build-logs-${{ github.run_id }}
          path: gcc16-logs
          retention-days: 30
