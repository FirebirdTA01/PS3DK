name: Regression Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_root:
        description: "Path to a fresh extracted PS3 SDK package on the runner"
        required: true
        default: "C:\\ps3sdk"
  workflow_call:
    inputs:
      sdk_root:
        description: "Path to a fresh extracted PS3 SDK package on the runner"
        required: true
        type: string

jobs:
  host-stub-regression:
    name: Host-stub regression probe build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure host-stub regression probe
        run: cmake -S tests/regression/librt-posix -B build/regression/librt-posix-host -DPS3TC_REGRESSION_HOST_STUB=ON

      - name: Build host-stub regression probe
        run: cmake --build build/regression/librt-posix-host

  package-regression:
    name: Package regression probe build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify SDK root
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '${{ inputs.sdk_root }}')) {
            throw "Regression build requires an extracted SDK at '${{ inputs.sdk_root }}'. Runtime regression requires a Windows self-hosted runner with desktop RPCS3."
          }

      - name: Build regression probes
        shell: pwsh
        run: |
          ./scripts/build-regression.ps1 -SdkRoot '${{ inputs.sdk_root }}' -BuildRoot "$env:RUNNER_TEMP\ps3-regression-build"
