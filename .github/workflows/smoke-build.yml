name: Smoke Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_root:
        description: "Path to a fresh extracted PS3 SDK package on the runner"
        required: true
        default: "C:\\ps3sdk"
  workflow_call:
    inputs:
      sdk_root:
        description: "Path to a fresh extracted PS3 SDK package on the runner"
        required: true
        type: string

jobs:
  host-stub-smoke:
    name: Host-stub smoke probe build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure host-stub smoke probe
        run: cmake -S tests/smoke/librt-posix -B build/smoke/librt-posix-host -DPS3TC_SMOKE_HOST_STUB=ON

      - name: Build host-stub smoke probe
        run: cmake --build build/smoke/librt-posix-host

  package-smoke:
    name: Package smoke probe build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify SDK root
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '${{ inputs.sdk_root }}')) {
            throw "Smoke build requires an extracted SDK at '${{ inputs.sdk_root }}'. Runtime smoke requires a Windows self-hosted runner with desktop RPCS3."
          }

      - name: Build smoke probes
        shell: pwsh
        run: |
          ./scripts/build-smoke.ps1 -SdkRoot '${{ inputs.sdk_root }}' -BuildRoot "$env:RUNNER_TEMP\ps3-smoke-build"
